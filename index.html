<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestión Notarial - SaaS</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para Iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SweetAlert2 para Alertas Estilizadas -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- SheetJS para Exportación a Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <!-- FIREBASE SDK (Compat Version para máxima compatibilidad con Vanilla JS) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: 'var(--color-primary)', 
                        secondary: '#3b82f6',
                        accent: '#fbbf24',
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --color-primary: #1e3a8a; 
        }
        body { font-family: 'Inter', system-ui, sans-serif; }
        .glass-effect {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
        }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .dyn-bg-primary { background-color: var(--color-primary) !important; }
        .dyn-text-primary { color: var(--color-primary) !important; }
        .dyn-border-primary { border-color: var(--color-primary) !important; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 overflow-hidden">

    <!-- CONTENEDOR PRINCIPAL -->
    <div id="app" class="h-screen w-full flex flex-col">
        <!-- Las vistas se inyectarán aquí mediante JavaScript -->
    </div>

    <!-- CONTENEDOR DE MODALES -->
    <div id="modal-container" class="relative z-50 hidden" aria-labelledby="modal-title" role="dialog" aria-modal="true">
        <!-- El contenido del modal se inyectará aquí -->
    </div>

    <!-- LÓGICA DE LA APLICACIÓN -->
    <script>
        // --- 1. CONFIGURACIÓN E INICIALIZACIÓN DE FIREBASE ---
        const firebaseConfig = {
            apiKey: "AIzaSyDVjVhJWhK3g1Yv0z9Yx1YLfpsX2bOGeCg",
            authDomain: "sistema-notarial-uafe.firebaseapp.com",
            projectId: "sistema-notarial-uafe",
            storageBucket: "sistema-notarial-uafe.firebasestorage.app",
            messagingSenderId: "412500807010",
            appId: "1:412500807010:web:4466cbccc2cf8ecc5df03b"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // --- CONFIGURACIÓN DINÁMICA DE LA INTERFAZ ---
        let sysConfig = JSON.parse(localStorage.getItem('notarySysConfig')) || {
            tituloApp: 'NEXUM',
            colorPrincipal: '#1e3a8a'
        };

        function aplicarConfiguracion() {
            document.documentElement.style.setProperty('--color-primary', sysConfig.colorPrincipal);
            document.title = sysConfig.tituloApp + ' - Gestión Notarial';
            
            const titleElements = document.querySelectorAll('.app-title-text');
            titleElements.forEach(el => el.innerText = sysConfig.tituloApp);
        }
        aplicarConfiguracion();

        // --- 2. BASE DE DATOS LOCAL (Sincronizada con Firebase) ---
        const LOCAL_DB = {
            notarias: [],
            users: [],
            actos: [],
            fuentesConsulta: []
        };

        const CATEGORIAS = {
            'Protocolo': [
                "Promesas de celebrar contratos", "Compraventa", "Compraventa de inmuebles (MIDUVI)", 
                "Transferencia de dominio con constitución de hipoteca", "Constitución de hipoteca", 
                "Constitución de hipoteca (BIESS/BEV/Municipalidades/Mutualistas/Cooperativas)", 
                "Constitución de hipoteca abierta", "Constitución de hipoteca (MIDUVI)", "Donación", 
                "Permuta", "Liquidación de la sociedad conyugal", "Liquidación de la sociedad de bienes", 
                "Dación en pago", "Cesión de derechos onerosos", "Comodato", 
                "Constitución de consorcios con cuantía determinada", "Traspaso de un crédito con cuantía", 
                "Cesión de participaciones"
            ],
            'Diligencia': [
                "Reconocimiento de firmas de vehículo", "Reconocimiento de firmas de contrato"
            ]
        };

        let state = {
            currentUser: null,
            currentView: 'login',
            filtroNotariaGeneral: null, // Para filtrar la vista actual (Actos, Riesgos)
            filtroNotariaReporte: null,
            adminTabActiva: 'usuarios' // Controla si se ven Usuarios o Notarías
        };

        // --- CARGAR DATOS DESDE LA NUBE ---
        async function loadDataFromFirebase() {
            try {
                const usersSnap = await db.collection('users').get();
                LOCAL_DB.users = usersSnap.docs.map(doc => ({ id: doc.id, ...doc.data() }));

                const notariasSnap = await db.collection('notarias').get();
                LOCAL_DB.notarias = notariasSnap.docs.map(doc => ({ id: doc.id, ...doc.data() }));

                const actosSnap = await db.collection('actos').get();
                LOCAL_DB.actos = actosSnap.docs.map(doc => ({ id: doc.id, ...doc.data() }));

                const fuentesSnap = await db.collection('fuentesConsulta').get();
                LOCAL_DB.fuentesConsulta = fuentesSnap.docs.map(doc => ({ id: doc.id, ...doc.data() }));

                // Semilla: Crear SuperAdmin si no existe
                if (LOCAL_DB.users.length === 0) {
                    const adminData = { username: 'sjcastillob', password: '1234', role: 1, notariaId: null, nombre: 'Admin Global' };
                    const adminRef = await db.collection('users').add(adminData);
                    LOCAL_DB.users.push({ id: adminRef.id, ...adminData });
                }

                // Semilla: Fuente de consulta judicial por defecto si no existe ninguna
                if (LOCAL_DB.fuentesConsulta.length === 0) {
                    const fuenteData = { nombre: 'Función Judicial - Procesos Judiciales', url: 'https://procesosjudiciales.funcionjudicial.gob.ec/busqueda-filtros' };
                    const fuenteRef = await db.collection('fuentesConsulta').add(fuenteData);
                    LOCAL_DB.fuentesConsulta.push({ id: fuenteRef.id, ...fuenteData });
                }
            } catch (error) {
                console.error("Error al cargar datos de Firebase:", error);
                Swal.fire('Error', 'No se pudo establecer conexión con la base de datos en la nube.', 'error');
            }
        }

        // --- FUNCIONES PRINCIPALES DE RENDERIZADO ---
        function renderApp() {
            const app = document.getElementById('app');
            if (!state.currentUser) {
                app.innerHTML = getLoginHTML();
            } else {
                app.innerHTML = getLayoutHTML();
                renderCurrentView();
            }
            aplicarConfiguracion();
        }

        function renderCurrentView() {
            const content = document.getElementById('main-content');
            if (!content) return;

            switch(state.currentView) {
                case 'dashboard': content.innerHTML = getDashboardHTML(); break;
                case 'usuarios': content.innerHTML = getUsuariosHTML(); break;
                case 'actos': content.innerHTML = getActosHTML(); renderActosTable(); break;
                case 'reportes': content.innerHTML = getReportesHTML(); renderReportesTables(); break;
                case 'riesgos': content.innerHTML = getRiesgosHTML(); break;
                case 'consultas': content.innerHTML = getConsultasHTML(); renderConsultasViewer(); break;
                default: content.innerHTML = getDashboardHTML();
            }
            updateSidebarActive();
            aplicarConfiguracion();
        }

        // --- COMPONENTES HTML (Plantillas) ---
        function getLoginHTML() {
            return `
                <div class="flex items-center justify-center h-full w-full bg-gradient-to-br dyn-bg-primary to-blue-800" style="background-color: var(--color-primary);">
                    <div class="bg-white p-8 rounded-xl shadow-2xl w-full max-w-md fade-in glass-effect">
                        <div class="text-center mb-8">
                            <div class="inline-flex items-center justify-center w-16 h-16 rounded-full dyn-bg-primary text-white mb-4 shadow-lg">
                                <i class="fas fa-balance-scale text-3xl"></i>
                            </div>
                            <h1 class="text-2xl font-bold text-gray-800 app-title-text">${sysConfig.tituloApp}</h1>
                            <p class="text-gray-500 text-sm mt-2">Ingrese sus credenciales para acceder</p>
                        </div>
                        <form onsubmit="handleLogin(event)" class="space-y-5">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Usuario</label>
                                <div class="relative">
                                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                        <i class="fas fa-user text-gray-400"></i>
                                    </div>
                                    <input type="text" id="login-username" required
                                        class="block w-full pl-10 pr-3 py-2 border border-gray-300 rounded-lg focus:outline-none dyn-border-primary sm:text-sm transition-colors"
                                        placeholder="Ingrese su usuario">
                                </div>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
                                <div class="relative">
                                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                        <i class="fas fa-lock text-gray-400"></i>
                                    </div>
                                    <input type="password" id="login-password" required
                                        class="block w-full pl-10 pr-3 py-2 border border-gray-300 rounded-lg focus:outline-none dyn-border-primary sm:text-sm transition-colors"
                                        placeholder="••••••••">
                                </div>
                            </div>
                            <button type="submit" class="w-full flex justify-center py-2.5 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white dyn-bg-primary hover:opacity-90 focus:outline-none transition-colors">
                                Ingresar
                            </button>
                        </form>
                    </div>
                </div>
            `;
        }

        function getLayoutHTML() {
            const roleName = state.currentUser.role === 1 ? 'SuperAdmin' : (state.currentUser.role === 2 ? 'Oficial de Cumplimiento' : 'Matrizador');
            const notariaName = state.currentUser.notariaId ? LOCAL_DB.notarias.find(n => n.id === state.currentUser.notariaId)?.nombre : 'Global';

            return `
                <!-- Topbar -->
                <header class="bg-white shadow-sm z-10 w-full flex-shrink-0 h-16 flex items-center justify-between px-6">
                    <div class="flex items-center gap-3">
                        <i class="fas fa-balance-scale dyn-text-primary text-2xl"></i>
                        <span class="font-bold text-lg text-gray-800 tracking-tight app-title-text">${sysConfig.tituloApp}</span>
                    </div>
                    <div class="flex items-center gap-6">
                        ${(state.currentUser.role === 1 || state.currentUser.role === 2) ? 
                            `<button onclick="navigate('usuarios')" class="text-gray-600 dyn-text-primary font-medium text-sm transition-colors hover:opacity-80">
                                <i class="fas fa-users-cog mr-1"></i> Administración
                            </button>` : ''
                        }
                        <div class="flex items-center gap-3 border-l pl-6 border-gray-200">
                            <div class="text-right hidden sm:block">
                                <p class="text-sm font-bold text-gray-800">${state.currentUser.nombre}</p>
                                <p class="text-xs text-gray-500">${roleName} | ${notariaName}</p>
                            </div>
                            <button onclick="handleLogout()" class="w-10 h-10 rounded-full bg-red-50 text-red-600 hover:bg-red-100 flex items-center justify-center transition-colors shadow-sm" title="Cerrar Sesión">
                                <i class="fas fa-sign-out-alt"></i>
                            </button>
                        </div>
                    </div>
                </header>

                <div class="flex flex-1 overflow-hidden">
                    <aside class="w-64 dyn-bg-primary text-white flex-shrink-0 overflow-y-auto hidden md:block">
                        <nav class="p-4 space-y-1">
                            <p class="px-3 text-xs font-semibold text-white/50 uppercase tracking-wider mb-2 mt-4">Principal</p>
                            
                            <a href="#" onclick="navigate('dashboard')" id="nav-dashboard" class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-black/20 transition-colors">
                                <i class="fas fa-home w-5 text-center"></i> <span>Inicio</span>
                            </a>
                            
                            <a href="#" onclick="navigate('actos')" id="nav-actos" class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-black/20 transition-colors">
                                <i class="fas fa-file-signature w-5 text-center"></i> <span>Creación de Actos</span>
                            </a>

                            <a href="#" onclick="navigate('consultas')" id="nav-consultas" class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-black/20 transition-colors">
                                <i class="fas fa-gavel w-5 text-center"></i> <span>Consultas Externas</span>
                            </a>

                            ${(state.currentUser.role === 1 || state.currentUser.role === 2) ? `
                                <p class="px-3 text-xs font-semibold text-white/50 uppercase tracking-wider mb-2 mt-6">Gestión e Informes</p>
                                <a href="#" onclick="navigate('reportes')" id="nav-reportes" class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-black/20 transition-colors">
                                    <i class="fas fa-chart-bar w-5 text-center"></i> <span>Generación de Reportes</span>
                                </a>
                                <a href="#" onclick="navigate('riesgos')" id="nav-riesgos" class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-black/20 transition-colors">
                                    <i class="fas fa-shield-alt w-5 text-center"></i> <span>Análisis de Riesgos</span>
                                </a>
                            ` : ''}
                        </nav>
                    </aside>

                    <main id="main-content" class="flex-1 overflow-y-auto p-6 bg-gray-50 fade-in">
                        <!-- Vista dinámica -->
                    </main>
                </div>
            `;
        }

        function getDashboardHTML() {
            return `
                <div class="h-full flex flex-col items-center justify-center text-center space-y-6">
                    <div class="w-32 h-32 bg-white rounded-full shadow-lg flex items-center justify-center border-4 border-gray-100">
                        <i class="fas fa-balance-scale text-6xl dyn-text-primary"></i>
                    </div>
                    <div>
                        <h2 class="text-3xl font-bold text-gray-800">Bienvenido a <span class="app-title-text">${sysConfig.tituloApp}</span></h2>
                        <p class="text-gray-500 mt-2 max-w-lg mx-auto">Plataforma integral para el control de actos, diligencias, cumplimiento y reportes operativos.</p>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 mt-8 w-full max-w-5xl">
                        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 flex flex-col items-center cursor-pointer hover:shadow-md transition-shadow" onclick="navigate('actos')">
                            <div class="bg-blue-50 p-3 rounded-full text-blue-600 mb-3"><i class="fas fa-file-alt text-xl"></i></div>
                            <h3 class="font-semibold text-gray-700">Actos Notariales</h3>
                            <p class="text-xs text-gray-400 mt-1">Gestionar protocolos y diligencias</p>
                        </div>
                        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 flex flex-col items-center cursor-pointer hover:shadow-md transition-shadow" onclick="navigate('consultas')">
                            <div class="bg-gray-100 p-3 rounded-full text-gray-600 mb-3"><i class="fas fa-gavel text-xl"></i></div>
                            <h3 class="font-semibold text-gray-700">Due Diligence</h3>
                            <p class="text-xs text-gray-400 mt-1">Consultas Externas</p>
                        </div>
                        ${(state.currentUser.role === 1 || state.currentUser.role === 2) ? `
                        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 flex flex-col items-center cursor-pointer hover:shadow-md transition-shadow" onclick="navigate('reportes')">
                            <div class="bg-green-50 p-3 rounded-full text-green-600 mb-3"><i class="fas fa-chart-line text-xl"></i></div>
                            <h3 class="font-semibold text-gray-700">Reportes</h3>
                            <p class="text-xs text-gray-400 mt-1">Exportar a Excel (.xlsx)</p>
                        </div>
                        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 flex flex-col items-center cursor-pointer hover:shadow-md transition-shadow" onclick="navigate('usuarios')">
                            <div class="bg-purple-50 p-3 rounded-full text-purple-600 mb-3"><i class="fas fa-users-cog text-xl"></i></div>
                            <h3 class="font-semibold text-gray-700">Administración</h3>
                            <p class="text-xs text-gray-400 mt-1">Usuarios y Notarías</p>
                        </div>
                        ` : ''}
                    </div>
                </div>
            `;
        }

        // --- MÓDULO DE ACTOS ---
        function getActosHTML() {
            let notariaSelector = '';
            if (state.currentUser.role === 1) {
                notariaSelector = `
                    <select id="filtro_notaria_actos" class="border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none dyn-border-primary bg-white shadow-sm" onchange="cambiarFiltroGeneral(this.value)">
                        <option value="">Todas las Notarías</option>
                        ${LOCAL_DB.notarias.map(n => `<option value="${n.id}" ${state.filtroNotariaGeneral === n.id ? 'selected':''}>${n.nombre}</option>`).join('')}
                    </select>
                `;
            }

            const headerRole = (state.currentUser.role === 1 || state.currentUser.role === 2) ? `<th class="p-4 font-semibold">Creado Por</th>` : '';

            return `
                <div class="space-y-6">
                    <div class="flex flex-col lg:flex-row justify-between lg:items-center bg-white p-4 rounded-xl shadow-sm border border-gray-100 gap-4">
                        <div>
                            <h2 class="text-xl font-bold text-gray-800"><i class="fas fa-file-signature dyn-text-primary mr-2"></i> Creación y Gestión de Actos</h2>
                            <p class="text-sm text-gray-500">Administre los protocolos y diligencias de su notaría.</p>
                        </div>
                        <div class="flex items-center flex-wrap gap-4">
                            ${notariaSelector}
                            <div class="relative">
                                <i class="fas fa-search absolute left-3 top-3 text-gray-400"></i>
                                <input type="text" id="buscador-actos" oninput="renderActosTable()" placeholder="Buscar Número o ID..." class="pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:outline-none dyn-border-primary text-sm w-full lg:w-64">
                            </div>
                            <button onclick="openNuevoActoModal()" class="dyn-bg-primary text-white px-5 py-2.5 rounded-lg shadow-sm font-medium flex items-center gap-2 hover:opacity-90 transition-colors w-full lg:w-auto justify-center">
                                <i class="fas fa-plus"></i> Ingresar Nuevo Acto
                            </button>
                        </div>
                    </div>

                    <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse">
                                <thead>
                                    <tr class="bg-gray-50 text-gray-600 text-sm border-b">
                                        <th class="p-4 font-semibold">ID Sistema</th>
                                        <th class="p-4 font-semibold">Nº Trámite</th>
                                        <th class="p-4 font-semibold">Categoría del Acto</th>
                                        <th class="p-4 font-semibold">Tipo</th>
                                        <th class="p-4 font-semibold">Fecha</th>
                                        ${headerRole}
                                        <th class="p-4 font-semibold w-32 text-right">Acciones</th>
                                    </tr>
                                </thead>
                                <tbody id="actos-table-body" class="divide-y divide-gray-100">
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        function cambiarFiltroGeneral(val) {
            state.filtroNotariaGeneral = val || null;
            if (state.currentView === 'actos') renderActosTable();
            if (state.currentView === 'riesgos') renderCurrentView(); // Si hubiera tabla en riesgos
        }

        function renderActosTable() {
            const tbody = document.getElementById('actos-table-body');
            const buscadorInput = document.getElementById('buscador-actos');
            if(!tbody) return;

            let actosMostrar = LOCAL_DB.actos;
            
            // FILTRO DE ROLES PARA ACTOS
            if (state.currentUser.role === 2) {
                // Oficial ve todos los actos de su notaría
                actosMostrar = actosMostrar.filter(a => a.notariaId === state.currentUser.notariaId);
            } else if (state.currentUser.role === 1 && state.filtroNotariaGeneral) {
                // SuperAdmin ve lo que seleccione en el filtro
                actosMostrar = actosMostrar.filter(a => a.notariaId === state.filtroNotariaGeneral);
            } else if (state.currentUser.role === 3) {
                // Matrizador SOLO ve los actos de su notaría creados por él mismo
                actosMostrar = actosMostrar.filter(a => a.notariaId === state.currentUser.notariaId && a.creadoPorId === state.currentUser.id);
            }

            const termino = buscadorInput ? buscadorInput.value.toLowerCase() : '';
            if (termino.trim() !== '') {
                actosMostrar = actosMostrar.filter(a => {
                    const seqStr = 'Acto-' + String(a.secuencial || 0).padStart(5, '0');
                    return seqStr.toLowerCase().includes(termino) || String(a.numero || '').toLowerCase().includes(termino);
                });
            }

            actosMostrar.sort((a, b) => new Date(b.fecha) - new Date(a.fecha));

            if (actosMostrar.length === 0) {
                const cols = (state.currentUser.role === 1 || state.currentUser.role === 2) ? 7 : 6;
                tbody.innerHTML = `<tr><td colspan="${cols}" class="p-8 text-center text-gray-500">No hay actos registrados.</td></tr>`;
                return;
            }

            tbody.innerHTML = actosMostrar.map(acto => {
                const seqStr = 'Acto-' + String(acto.secuencial || 0).padStart(5, '0');
                const numTramiteHtml = acto.numero ? acto.numero : '<span class="text-gray-400 italic text-xs">Pendiente</span>';
                
                const colCreadoPor = (state.currentUser.role === 1 || state.currentUser.role === 2) ? 
                    `<td class="p-4 text-sm text-gray-600">${acto.creadoPorNombre || 'Sistema'}</td>` : '';

                return `
                <tr class="hover:bg-blue-50/50 transition-colors group">
                    <td class="p-4 font-bold text-gray-800">${seqStr}</td>
                    <td class="p-4 text-sm font-medium text-gray-700">${numTramiteHtml}</td>
                    <td class="p-4 text-sm text-gray-600">${acto.categoria}</td>
                    <td class="p-4">
                        <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ${acto.tipo === 'Protocolo' ? 'bg-indigo-100 text-indigo-800' : 'bg-teal-100 text-teal-800'}">
                            ${acto.tipo}
                        </span>
                    </td>
                    <td class="p-4 text-sm text-gray-500 whitespace-nowrap"><i class="far fa-calendar-alt mr-1"></i> ${acto.fecha}</td>
                    ${colCreadoPor}
                    <td class="p-4 whitespace-nowrap">
                        <div class="flex items-center justify-end gap-2">
                            <button onclick="openEditActoModal('${acto.id}')" class="w-8 h-8 rounded-full bg-amber-100 text-amber-600 hover:bg-amber-500 hover:text-white flex items-center justify-center transition-colors" title="Editar Detalles e Intervinientes">
                                <i class="fas fa-edit"></i>
                            </button>

        async function guardarNuevoActo(e) {
            e.preventDefault();
            Swal.fire({ title: 'Guardando en la nube...', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } });

            const tipo = document.querySelector('input[name="tipo_tramite"]:checked').value;
            const numero = document.getElementById('acto_numero').value;
            const fecha = document.getElementById('acto_fecha').value;
            const categoria = document.getElementById('acto_categoria').value;
            
            // Determinar notaría a la que va el acto
            let notariaId = state.currentUser.notariaId;
            if (state.currentUser.role === 1) {
                if (state.filtroNotariaGeneral) {
                    notariaId = state.filtroNotariaGeneral;
                } else {
                    Swal.fire('Atención', 'Como Administrador Global, primero debe seleccionar una "Notaría" en el filtro de la parte superior antes de crear un Acto.', 'warning');
                    return;
                }
            }

            const actosNotaria = LOCAL_DB.actos.filter(a => a.notariaId === notariaId);
            const maxSecuencial = actosNotaria.reduce((max, a) => Math.max(max, a.secuencial || 0), 0);
            const nuevoSecuencial = maxSecuencial + 1;

            const nuevoActoData = { 
                notariaId: notariaId, 
                secuencial: nuevoSecuencial, 
                tipo: tipo, 
                numero: numero, 
                categoria: categoria, 
                fecha: fecha, 
                cuantia: '', 
                forma_pago: '', 
                intervinientes: [],
                creadoPorId: state.currentUser.id,
                creadoPorNombre: state.currentUser.nombre 
            };

            try {
                const docRef = await db.collection('actos').add(nuevoActoData);
                nuevoActoData.id = docRef.id;
                
                LOCAL_DB.actos.push(nuevoActoData);
                closeModal();
                Swal.fire({ icon: 'success', title: 'Guardado', text: 'El acto ha sido registrado exitosamente.', timer: 1500, showConfirmButton: false });
                if (state.currentView === 'actos') renderActosTable();
            } catch (error) {
                console.error(error);
                Swal.fire('Error', 'No se pudo guardar en la base de datos.', 'error');
            }
        }

        async function guardarEdicionActo(e, actoId) {
            e.preventDefault();
            window.syncIntervinientesForm();

            let isValid = true;
            for(let int of window._tempEditIntervinientes) {
                if(!int.identificacion || !int.nombre || !int.nacionalidad) isValid = false;
            }
            if(!isValid) {
                Swal.fire('Campos Incompletos', 'Por favor, complete todos los campos obligatorios de los intervinientes antes de guardar.', 'warning');
                return;
            }

            Swal.fire({ title: 'Guardando Cambios...', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } });

            const actoIndex = LOCAL_DB.actos.findIndex(a => a.id === actoId);
            if(actoIndex === -1) return;

            const updateData = {
                numero: document.getElementById('edit_numero').value,
                fecha: document.getElementById('edit_fecha').value,
                cuantia: document.getElementById('edit_cuantia').value,
                forma_pago: document.getElementById('edit_forma_pago').value,
                intervinientes: window._tempEditIntervinientes
            };

            try {
                await db.collection('actos').doc(actoId).update(updateData);
                LOCAL_DB.actos[actoIndex] = { ...LOCAL_DB.actos[actoIndex], ...updateData };
                closeModal();
                Swal.fire({ icon: 'success', title: 'Actualizado', text: 'El acto y sus intervinientes fueron guardados.', timer: 2000, showConfirmButton: false });
                if (state.currentView === 'actos') renderActosTable();
            } catch (error) {
                Swal.fire('Error', 'No se pudo actualizar el registro en la nube.', 'error');
            }
        }

        function descargarFormulario(actoId) {
            const acto = LOCAL_DB.actos.find(a => a.id === actoId);
            if(!acto) return;
            const seqStr = 'Acto-' + String(acto.secuencial || 0).padStart(5, '0');

            let contenido = `====================================================\n`;
            contenido += `           FORMULARIO DE TRÁMITE NOTARIAL           \n`;
            contenido += `====================================================\n\n`;
            contenido += `DATOS DEL ACTO\n`;
            contenido += `----------------------------------------------------\n`;
            contenido += `ID Sistema:        ${seqStr}\n`;
            contenido += `Número de Trámite: ${acto.numero || 'Pendiente'}\n`;
            contenido += `Tipo de Trámite:   ${acto.tipo}\n`;
            contenido += `Categoría:         ${acto.categoria}\n`;
            contenido += `Fecha:             ${acto.fecha}\n`;
            contenido += `Cuantía:           $ ${acto.cuantia || '0.00'}\n`;
            contenido += `Forma de Pago:     ${acto.forma_pago || 'No especificada'}\n`;
            contenido += `Creado Por:        ${acto.creadoPorNombre || 'No registrado'}\n\n`;
            
            contenido += `INTERVINIENTES\n`;
            contenido += `----------------------------------------------------\n`;
            if (acto.intervinientes.length === 0) {
                contenido += `No hay intervinientes registrados.\n`;
            } else {
                acto.intervinientes.forEach((int, i) => {
                    contenido += `[${i+1}] ${int.tipo.toUpperCase()}\n`;
                    contenido += `    Nombre:         ${int.nombre}\n`;
                    contenido += `    Identificación: ${int.identificacion}\n`;
                    contenido += `    Nacionalidad:   ${int.nacionalidad}\n\n`;
                });
            }
            contenido += `====================================================\n`;

            const blob = new Blob([contenido], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Formulario_${seqStr}.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function eliminarActo(actoId) {
            Swal.fire({
                title: '¿Está seguro que desea eliminar este acto?',
                text: "Esta acción lo borrará permanentemente de la nube.",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#d33',
                cancelButtonColor: '#3085d6',
                confirmButtonText: 'Sí, eliminar',
                cancelButtonText: 'Cancelar'
            }).then(async (result) => {
                if (result.isConfirmed) {
                    Swal.fire({ title: 'Eliminando...', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } });
                    try {
                        await db.collection('actos').doc(actoId).delete();
                        LOCAL_DB.actos = LOCAL_DB.actos.filter(a => a.id !== actoId);
                        if (state.currentView === 'actos') renderActosTable();
                        Swal.fire('Eliminado!', 'El acto ha sido eliminado de la nube.', 'success');
                    } catch (error) {
                        Swal.fire('Error', 'No se pudo eliminar el registro.', 'error');
                    }
                }
            });
        }

        function getActosFiltradosReporte() {
            let actosFiltrados = LOCAL_DB.actos;
            if (state.currentUser.role === 2) {
                actosFiltrados = actosFiltrados.filter(a => a.notariaId === state.currentUser.notariaId);
            } else if (state.currentUser.role === 1 && state.filtroNotariaReporte) {
                actosFiltrados = actosFiltrados.filter(a => a.notariaId === state.filtroNotariaReporte);
            }

            if (currentReportTab === 'protocolos') {
                return actosFiltrados.filter(a => a.tipo === 'Protocolo');
            } else if (currentReportTab === 'vehiculos') {
                return actosFiltrados.filter(a => a.categoria === 'Reconocimiento de firmas de vehículo');
            } else if (currentReportTab === 'contratos') {
                return actosFiltrados.filter(a => a.categoria === 'Reconocimiento de firmas de contrato');
            }
            return actosFiltrados;
        }

        function exportarExcel(tipo) {
            const actosFiltrados = getActosFiltradosReporte();
            
            if (actosFiltrados.length === 0) {
                Swal.fire('Info', 'No hay datos para exportar.', 'info');
                return;
            }

            let wb = XLSX.utils.book_new();
            let ws;

            if (tipo === 'TODO') {
                const table = document.getElementById('tabla-reporte-datos');
                if (!table) return;
                ws = XLSX.utils.table_to_sheet(table, {sheet: currentReportTab});
                XLSX.utils.book_append_sheet(wb, ws, currentReportTab);
            } 
            else if (tipo === 'INT') {
                let data = [];
                actosFiltrados.forEach(a => {
                    const seqStr = `Acto-${String(a.secuencial || 0).padStart(5, '0')}`;
                    if (a.intervinientes.length === 0) {
                        data.push({ "ID Sistema": seqStr, "Nº Trámite": a.numero || "Pendiente", "Interviniente": "SIN REGISTROS" });
                    } else {
                        a.intervinientes.forEach(int => {
                            data.push({
                                "ID Sistema": seqStr,
                                "Nº Trámite": a.numero || "Pendiente",
                                "Calidad": int.tipo,
                                "Nombre": int.nombre,
                                "Identificación": int.identificacion,
                                "Nacionalidad": int.nacionalidad
                            });
                        });
                    }
                });
                ws = XLSX.utils.json_to_sheet(data);
                XLSX.utils.book_append_sheet(wb, ws, 'Intervinientes');
            }
            else if (tipo === 'TRA') {
                let data = actosFiltrados.map(a => {
                    const seqStr = `Acto-${String(a.secuencial || 0).padStart(5, '0')}`;
                    return {
                        "ID Sistema": seqStr,
                        "Nº Trámite": a.numero || "Pendiente",
                        "Tipo": a.tipo,
                        "Categoría": a.categoria,
                        "Fecha": a.fecha,
                        "Cuantía": a.cuantia,
                        "Forma Pago": a.forma_pago,
                        "Creado Por": a.creadoPorNombre || ''
                    };
                });
                ws = XLSX.utils.json_to_sheet(data);
                XLSX.utils.book_append_sheet(wb, ws, 'Trámites');
            }
            
            const dateStr = new Date().toISOString().slice(0,10);
            const fileName = `Reporte_${tipo}_${currentReportTab}_${dateStr}.xlsx`;
            XLSX.writeFile(wb, fileName);
            Swal.fire({ icon: 'success', title: '¡Descarga Iniciada!', text: `Se ha generado el archivo: ${fileName}`, timer: 2000, showConfirmButton: false });
        }

            currentReportTab = tab;
            ['protocolos', 'vehiculos', 'contratos'].forEach(t => {

                if(t === tab) {

        function renderReportesTables() {
            const container = document.getElementById('reporte-container');
            if(!container) return;

            const actosFiltrados = getActosFiltradosReporte();

            if (actosFiltrados.length === 0) {
                container.innerHTML = `<div class="p-10 text-center text-gray-500"><i class="fas fa-folder-open text-4xl mb-3 opacity-30"></i><p>No hay datos para generar este reporte.</p></div>`;
                return;
            }

            let html = `
                <div class="overflow-x-auto max-h-[60vh] custom-scrollbar">
                    <table id="tabla-reporte-datos" class="min-w-full text-sm border-collapse excel-table">
                        <thead class="bg-gray-100 sticky top-0 shadow-sm z-10">
                            <tr>
                                <th class="border border-gray-300 p-2 text-left font-semibold text-gray-700 bg-gray-200 w-24">ID Sistema</th>

                                <th class="border border-gray-300 p-2 text-left font-semibold text-gray-700 bg-gray-200 min-w-[200px]">Nombre del Acto</th>
                                <th class="border border-gray-300 p-2 text-left font-semibold text-gray-700 bg-gray-200 w-32">Fecha</th>
                                <th class="border border-gray-300 p-2 text-left font-semibold text-gray-700 bg-gray-200">Interviniente</th>
                                <th class="border border-gray-300 p-2 text-left font-semibold text-gray-700 bg-gray-200 w-24">Calidad</th>
                                <th class="border border-gray-300 p-2 text-left font-semibold text-gray-700 bg-gray-200 w-40">Identificación</th>
                                <th class="border border-gray-300 p-2 text-left font-semibold text-gray-700 bg-gray-200 w-32">Nacionalidad</th>
                            </tr>
                        </thead>
                        <tbody class="bg-white">
            `;

            actosFiltrados.forEach(acto => {
                const seqStr = 'Acto-' + String(acto.secuencial || 0).padStart(5, '0');
                const numTramiteStr = acto.numero || '-';

                let intervinientes = [...acto.intervinientes].sort((a, b) => {
                    if (a.tipo === 'Otorgante' && b.tipo === 'Beneficiario') return -1;
                    if (a.tipo === 'Beneficiario' && b.tipo === 'Otorgante') return 1;
                    return 0;
                });

                if (intervinientes.length === 0) {
                    html += `
                        <tr class="hover:bg-gray-50">
                            <td class="border border-gray-200 p-2 text-gray-800 align-top">${seqStr}</td>
                            <td class="border border-gray-200 p-2 text-gray-800 align-top">${numTramiteStr}</td>

                            <td class="border border-gray-200 p-2 text-gray-800 align-top">${acto.fecha}</td>
                            <td class="border border-gray-200 p-2 text-gray-400 italic text-center" colspan="4">Sin intervinientes registrados</td>
                        </tr>
                    `;
                } else {
                    const rowSpan = intervinientes.length;
                    html += `<tr class="hover:bg-gray-50">
                        <td class="border border-gray-200 p-2 text-gray-800 align-top font-semibold" rowspan="${rowSpan}">${seqStr}</td>
                        <td class="border border-gray-200 p-2 text-gray-800 align-top" rowspan="${rowSpan}">${numTramiteStr}</td>
                        <td class="border border-gray-200 p-2 text-gray-800 align-top" rowspan="${rowSpan}">${acto.categoria}</td>
                        <td class="border border-gray-200 p-2 text-gray-800 align-top" rowspan="${rowSpan}">${acto.fecha}</td>
                    `;

                    intervinientes.forEach((int, index) => {
                        if (index > 0) html += `<tr class="hover:bg-gray-50">`;
                        
                        html += `
                            <td class="border border-gray-200 p-2 text-gray-800">${int.nombre}</td>
                            <td class="border border-gray-200 p-2 text-gray-800 font-semibold text-xs uppercase">${int.tipo}</td>
                            <td class="border border-gray-200 p-2 text-gray-800 font-mono text-xs">${int.identificacion}</td>
                            <td class="border border-gray-200 p-2 text-gray-800">${int.nacionalidad}</td>
                        </tr>`;
                    });
                }
            });

            html += `</tbody></table></div>`;
            container.innerHTML = html;
        }

        async function guardarNuevaNotaria(e) {
            e.preventDefault();
            const nombre = document.getElementById('nueva_not_nombre').value.trim();
            if(!nombre) return;

            Swal.fire({ title: 'Creando Entidad...', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } });
            
            try {
                const notariaRef = await db.collection('notarias').add({ nombre: nombre });
                LOCAL_DB.notarias.push({ id: notariaRef.id, nombre: nombre });
                closeModal();
                Swal.fire({ icon: 'success', title: 'Notaría Registrada', timer: 1500, showConfirmButton: false });
                renderCurrentView();
            } catch (error) {
                Swal.fire('Error', 'No se pudo crear la notaría.', 'error');
            }
        }

        function eliminarNotaria(notariaId) {
            const numUsuarios = LOCAL_DB.users.filter(u => u.notariaId === notariaId).length;
            const numActos = LOCAL_DB.actos.filter(a => a.notariaId === notariaId).length;

            if (numUsuarios > 0 || numActos > 0) {
                Swal.fire('Acción Bloqueada', `No puede eliminar esta Notaría porque tiene <b>${numUsuarios} usuarios</b> y <b>${numActos} actos</b> asignados. Elimine o reasigne estos registros primero.`, 'warning');
                return;
            }

            Swal.fire({
                title: '¿Eliminar Notaría?',
                text: "Esta entidad será borrada permanentemente.",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#d33',
                cancelButtonColor: '#3085d6',
                confirmButtonText: 'Sí, eliminar',
                cancelButtonText: 'Cancelar'
            }).then(async (result) => {
                if (result.isConfirmed) {
                    Swal.fire({ title: 'Eliminando...', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } });
                    try {
                        await db.collection('notarias').doc(notariaId).delete();
                        LOCAL_DB.notarias = LOCAL_DB.notarias.filter(n => n.id !== notariaId);
                        renderCurrentView();
                        Swal.fire('Eliminada', 'La notaría fue eliminada.', 'success');
                    } catch (error) {
                        Swal.fire('Error', 'No se pudo eliminar de la base de datos.', 'error');
                    }
                }
            });
        }

                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Rol en el Sistema</label>
                            <select id="usr_rol" required class="block w-full border border-gray-300 rounded-lg px-3 py-2 sm:text-sm bg-white focus:ring-primary focus:border-primary" onchange="toggleNotariaFields()">
                                ${roleOptions}
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Notaría Asignada</label>
                            <select id="usr_notaria" required class="block w-full border border-gray-300 rounded-lg px-3 py-2 sm:text-sm bg-white focus:ring-primary focus:border-primary">
                                ${notariaOptions}
                            </select>
                        </div>
                        <div class="flex justify-end gap-3 pt-4 border-t border-gray-100">
                            <button type="button" onclick="closeModal()" class="px-4 py-2 bg-white border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50 transition-colors">Cancelar</button>
                            <button type="submit" class="px-4 py-2 bg-purple-600 rounded-lg text-white hover:bg-purple-700 transition-colors font-medium">Crear Usuario</button>
                        </div>
                    </form>
                </div>
            `;
            showModal(html);
            
            window.toggleNotariaFields = function() {
                const rolSelect = document.getElementById('usr_rol');
                const notariaSelect = document.getElementById('usr_notaria');
                if(rolSelect && rolSelect.value === "1") {
                    notariaSelect.value = ""; 
                    notariaSelect.disabled = true;
                    notariaSelect.required = false;
                } else {
                    notariaSelect.disabled = false;
                    notariaSelect.required = true;
                }
            };
            window.toggleNotariaFields();
        }

        async function guardarNuevoUsuario(e) {
            e.preventDefault();
            Swal.fire({ title: 'Creando cuenta en la nube...', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } });

            const nombre = document.getElementById('usr_nombre').value;
            const username = document.getElementById('usr_username').value;
            const password = document.getElementById('usr_password').value;
            const rol = parseInt(document.getElementById('usr_rol').value);
            let notariaId = document.getElementById('usr_notaria').value;

            if(LOCAL_DB.users.some(u => u.username === username)) {
                Swal.fire('Error', 'El nombre de usuario ya está en uso.', 'error');
                return;
            }

            if (rol === 1) notariaId = null;

            try {
                const nuevoUsuario = { nombre: nombre, username: username, password: password, role: rol, notariaId: notariaId };
                const docRef = await db.collection('users').add(nuevoUsuario);
                nuevoUsuario.id = docRef.id;
                
                LOCAL_DB.users.push(nuevoUsuario);

                closeModal();
                Swal.fire({ icon: 'success', title: '¡Usuario Creado!', text: 'El usuario ha sido registrado exitosamente.', confirmButtonColor: '#9333ea' });
                if (state.currentView === 'usuarios') renderCurrentView();

            } catch (error) {
                Swal.fire('Error', 'No se pudo crear el usuario en la nube.', 'error');
            }
        }

        function openEditUsuarioModal(userId) {
            const userToEdit = LOCAL_DB.users.find(u => u.id === userId);
            if (!userToEdit) return;

            const html = `
                <div class="bg-white rounded-xl shadow-2xl w-full max-w-lg overflow-hidden transform transition-all fade-in">
                    <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center bg-gray-50">
                        <h3 class="text-lg font-bold text-gray-800">Editar Usuario / Contraseña</h3>
                        <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600"><i class="fas fa-times"></i></button>
                    </div>
                    <form onsubmit="guardarEdicionUsuario(event, '${userId}')" class="p-6 space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Nombre Completo</label>
                            <input type="text" id="edit_usr_nombre" value="${userToEdit.nombre}" required class="block w-full border border-gray-300 rounded-lg px-3 py-2 sm:text-sm focus:ring-primary focus:border-primary">
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Usuario (Login)</label>
                                <input type="text" id="edit_usr_username" value="${userToEdit.username}" required class="block w-full border border-gray-300 rounded-lg px-3 py-2 sm:text-sm focus:ring-primary focus:border-primary">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Nueva Contraseña</label>
                                <input type="password" id="edit_usr_password" placeholder="Dejar en blanco para no cambiar" class="block w-full border border-gray-300 rounded-lg px-3 py-2 sm:text-sm placeholder:text-xs focus:ring-primary focus:border-primary">
                            </div>
                        </div>
                        <div class="flex justify-end gap-3 pt-4 border-t border-gray-100">
                            <button type="button" onclick="closeModal()" class="px-4 py-2 bg-white border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50 transition-colors">Cancelar</button>
                            <button type="submit" class="px-4 py-2 bg-amber-500 rounded-lg text-white hover:bg-amber-600 transition-colors font-medium">Actualizar en la Nube</button>
                        </div>
                    </form>
                </div>
            `;
            showModal(html);
        }

        async function guardarEdicionUsuario(e, userId) {
            e.preventDefault();
            const userIndex = LOCAL_DB.users.findIndex(u => u.id === userId);
            if (userIndex === -1) return;

            const newNombre = document.getElementById('edit_usr_nombre').value;
            const newUsername = document.getElementById('edit_usr_username').value;
            const newPassword = document.getElementById('edit_usr_password').value;

            if(LOCAL_DB.users.some(u => u.username === newUsername && u.id !== userId)) {
                Swal.fire('Error', 'El nombre de usuario ya está en uso por otra persona.', 'error');
                return;
            }

            Swal.fire({ title: 'Actualizando...', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } });

            const updateData = { nombre: newNombre, username: newUsername };
            if (newPassword.trim() !== '') { updateData.password = newPassword; }

            try {
                await db.collection('users').doc(userId).update(updateData);
                LOCAL_DB.users[userIndex] = { ...LOCAL_DB.users[userIndex], ...updateData };
                
                closeModal();
                Swal.fire({ icon: 'success', title: 'Usuario Actualizado', text: 'Los datos se guardaron en la nube correctamente.', timer: 2000, showConfirmButton: false });
                if (state.currentView === 'usuarios') renderCurrentView();
            } catch (error) {
                Swal.fire('Error', 'No se pudo actualizar el registro en la nube.', 'error');
            }
        }

        function eliminarUsuario(userId) {
            Swal.fire({
                title: '¿Eliminar Usuario?',
                text: "El usuario perderá el acceso permanentemente.",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#d33',
                cancelButtonColor: '#3085d6',
                confirmButtonText: 'Sí, eliminar',
                cancelButtonText: 'Cancelar'
            }).then(async (result) => {
                if (result.isConfirmed) {
                    Swal.fire({ title: 'Eliminando...', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } });
                    try {
                        await db.collection('users').doc(userId).delete();
                        LOCAL_DB.users = LOCAL_DB.users.filter(u => u.id !== userId);
                        if (state.currentView === 'usuarios') renderCurrentView();
                        Swal.fire('Eliminado', 'El usuario fue eliminado de la base de datos.', 'success');
                    } catch (error) {
                        Swal.fire('Error', 'No se pudo eliminar el usuario de la nube.', 'error');
                    }
                }
            });
        }

        // --- MÓDULO DE CONSULTA MULTI-FUENTE (Judicial, SRI, Registro Civil, etc.) ---
        function getHistorialCedulas() {
            return JSON.parse(localStorage.getItem('historialCedulasJudicial')) || [];
        }

        function guardarCedulaEnHistorial(cedula) {
            let historial = getHistorialCedulas().filter(c => c !== cedula);
            historial.unshift(cedula);
            historial = historial.slice(0, 8);
            localStorage.setItem('historialCedulasJudicial', JSON.stringify(historial));
            return historial;
        }

        function getConsultasHTML() {
            const fuentes = LOCAL_DB.fuentesConsulta;
            const esSuperAdmin = state.currentUser.role === 1;

            if (!state.consultaTabActivaId && fuentes.length > 0) {
                state.consultaTabActivaId = fuentes[0].id;
            }

            const tabsHtml = fuentes.map(f => `
                <div class="flex items-center gap-1 flex-shrink-0">
                    <button onclick="seleccionarFuenteConsulta('${f.id}')"
                        class="px-4 py-2.5 rounded-t-lg text-sm font-medium border-b-2 transition-colors whitespace-nowrap ${state.consultaTabActivaId === f.id ? 'dyn-border-primary dyn-text-primary bg-white' : 'border-transparent text-gray-500 hover:text-gray-700 bg-gray-100'}"
                        title="${f.url}">
                        ${f.nombre}
                    </button>
                    ${esSuperAdmin ? `
                    <button onclick="eliminarFuenteConsulta('${f.id}')" class="text-gray-400 hover:text-red-600 transition-colors px-1" title="Eliminar página">
                        <i class="fas fa-times text-xs"></i>
                    </button>
                    ` : ''}
                </div>
            `).join('');

            return `
                <div class="h-full flex flex-col space-y-4">
                    <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                        <h2 class="text-xl font-bold text-gray-800 mb-1"><i class="fas fa-gavel dyn-text-primary mr-2"></i> Consultas Externas (Due Diligence)</h2>
                        <p class="text-sm text-gray-500 mb-4">Ingresa la cédula/RUC, cópiala y navega entre las pestañas para buscar en cada fuente gubernamental.</p>
                        <div class="flex flex-wrap items-end gap-3">
                            <div class="flex-1 min-w-[220px]">
                                <label class="block text-sm font-medium text-gray-700 mb-1">Número de Cédula / RUC</label>
                                <input type="text" id="consulta_cedula_input" placeholder="Ej: 1712345678" maxlength="13"
                                    class="block w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none dyn-border-primary sm:text-sm shadow-sm">
                            </div>
                            <button type="button" onclick="copiarCedulaActual()" class="px-4 py-2 text-white rounded-lg hover:opacity-90 transition-colors font-medium dyn-bg-primary flex items-center gap-2 h-[38px] shadow-sm">
                                <i class="fas fa-copy"></i> Copiar
                            </button>
                            ${esSuperAdmin ? `
                            <button type="button" onclick="mostrarFormAgregarFuente()" class="px-4 py-2 bg-white border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50 transition-colors font-medium flex items-center gap-2 h-[38px] shadow-sm">
                                <i class="fas fa-plus"></i> Agregar página
                            </button>
                            ` : ''}
                        </div>
                        <div id="consulta_historial_lista" class="flex flex-wrap gap-2 mt-3"></div>
                        <div id="fuente-form-nueva" class="hidden mt-3 p-3 bg-gray-50 rounded-lg border border-gray-200 space-y-2">
                            <input type="text" id="nueva_fuente_nombre" placeholder="Nombre (Ej: SRI - Consulta RUC)" class="block w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-primary focus:border-primary">
                            <input type="text" id="nueva_fuente_url" placeholder="URL completa (https://...)" class="block w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-primary focus:border-primary">
                            <div class="flex justify-end gap-2">
                                <button type="button" onclick="document.getElementById('fuente-form-nueva').classList.add('hidden')" class="px-3 py-1.5 text-sm text-gray-600 hover:bg-gray-200 rounded">Cancelar</button>
                                <button type="button" onclick="agregarFuenteConsulta()" class="px-3 py-1.5 text-sm text-white rounded-lg dyn-bg-primary hover:opacity-90">Guardar página</button>
                            </div>
                        </div>
                    </div>

                    <div class="flex-1 bg-white rounded-xl shadow-sm border border-gray-100 flex flex-col overflow-hidden min-h-0">
                        ${fuentes.length === 0
                            ? `<div class="flex-1 flex items-center justify-center text-gray-400 text-sm">No hay páginas configuradas todavía.</div>`
                            : `
                            <div class="flex gap-1 px-2 pt-2 border-b border-gray-200 overflow-x-auto flex-shrink-0">${tabsHtml}</div>
                            <div id="consulta_visor_container" class="flex-1 min-h-0 relative"></div>
                            `
                        }
                    </div>
                </div>
            `;
        }

        function renderConsultasViewer() {
            const historial = getHistorialCedulas();
            const historialContainer = document.getElementById('consulta_historial_lista');
            if (historialContainer) {
                historialContainer.innerHTML = historial.length === 0 ? '' : historial.map(c => `
                    <button type="button" onclick="document.getElementById('consulta_cedula_input').value='${c}'" class="px-2.5 py-1 bg-gray-100 hover:bg-gray-200 rounded-md text-xs font-medium text-gray-700 transition-colors border border-gray-200">
                        ${c}
                    </button>
                `).join('');
            }

            const visorContainer = document.getElementById('consulta_visor_container');
            if (!visorContainer) return;

            const fuente = LOCAL_DB.fuentesConsulta.find(f => f.id === state.consultaTabActivaId);
            if (!fuente) {
                visorContainer.innerHTML = `<div class="absolute inset-0 flex items-center justify-center text-gray-400 text-sm">Selecciona una página.</div>`;
                return;
            }

            visorContainer.innerHTML = `
                <iframe src="${fuente.url}" class="absolute inset-0 w-full h-full border-0 bg-gray-50" id="consulta_iframe"></iframe>
                <div class="absolute bottom-3 right-3 bg-white shadow-lg border border-gray-200 rounded-lg px-3 py-2 flex items-center gap-2 text-xs text-gray-600">
                    <span>¿No carga? Algunos sitios bloquean mostrarse embebidos.</span>
                    <button onclick="abrirFuenteEnVentana('${fuente.id}')" class="px-2.5 py-1.5 dyn-bg-primary text-white rounded-md font-medium whitespace-nowrap hover:opacity-90 shadow-sm">Abrir aparte</button>
                </div>
            `;
        }

        function seleccionarFuenteConsulta(id) {
            state.consultaTabActivaId = id;
            if (state.currentView === 'consultas') {
                const content = document.getElementById('main-content');
                content.innerHTML = getConsultasHTML();
                renderConsultasViewer();
            }
        }

        function abrirFuenteEnVentana(id) {
            const fuente = LOCAL_DB.fuentesConsulta.find(f => f.id === id);
            if (!fuente) return;
            const w = 1000, h = 800;
            const left = (screen.width / 2) - (w / 2);
            const top = (screen.height / 2) - (h / 2);
            const ventana = window.open(
                fuente.url,
                'consultaExterna_' + fuente.id,
                `width=${w},height=${h},left=${left},top=${top},resizable=yes,scrollbars=yes,status=no,toolbar=no,menubar=no`
            );
            if (ventana) ventana.focus();
        }

        async function copiarCedulaActual() {
            const input = document.getElementById('consulta_cedula_input');
            const cedula = input.value.trim();
            if (!cedula) {
                Swal.fire('Falta la cédula', 'Ingresa un número de cédula antes de continuar.', 'warning');
                return;
            }
            try {
                await navigator.clipboard.writeText(cedula);
            } catch (error) {
                console.warn('No se pudo copiar automáticamente al portapapeles:', error);
            }
            guardarCedulaEnHistorial(cedula);
            renderConsultasViewer();
            Swal.fire({ icon: 'success', title: 'Cédula copiada', text: 'Pégala (Ctrl+V) en la página activa y busca.', timer: 2000, showConfirmButton: false });
        }

        function mostrarFormAgregarFuente() {
            document.getElementById('fuente-form-nueva').classList.remove('hidden');
        }

        async function agregarFuenteConsulta() {
            if (state.currentUser.role !== 1) return;
            const nombre = document.getElementById('nueva_fuente_nombre').value.trim();
            const url = document.getElementById('nueva_fuente_url').value.trim();
            if (!nombre || !/^https?:\/\/.+/.test(url)) {
                Swal.fire('Datos incompletos', 'Ingresa un nombre y una URL válida (debe iniciar con http:// o https://).', 'warning');
                return;
            }
            try {
                Swal.fire({ title: 'Guardando...', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } });
                const fuenteData = { nombre, url };
                const docRef = await db.collection('fuentesConsulta').add(fuenteData);
                LOCAL_DB.fuentesConsulta.push({ id: docRef.id, ...fuenteData });
                state.consultaTabActivaId = docRef.id;
                document.getElementById('main-content').innerHTML = getConsultasHTML();
                renderConsultasViewer();
                Swal.close();
            } catch (error) {
                Swal.fire('Error', 'No se pudo guardar la página en la nube.', 'error');
            }
        }

        async function eliminarFuenteConsulta(id) {
            if (state.currentUser.role !== 1) return;
            Swal.fire({
                title: '¿Eliminar Pestaña?',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#d33',
                cancelButtonColor: '#3085d6',
                confirmButtonText: 'Sí, eliminar',
                cancelButtonText: 'Cancelar'
            }).then(async (result) => {
                if (result.isConfirmed) {
                    try {
                        Swal.fire({ title: 'Eliminando...', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } });
                        await db.collection('fuentesConsulta').doc(id).delete();
                        LOCAL_DB.fuentesConsulta = LOCAL_DB.fuentesConsulta.filter(f => f.id !== id);
                        if (state.consultaTabActivaId === id) {
                            state.consultaTabActivaId = LOCAL_DB.fuentesConsulta.length > 0 ? LOCAL_DB.fuentesConsulta[0].id : null;
                        }
                        document.getElementById('main-content').innerHTML = getConsultasHTML();
                        renderConsultasViewer();
                        Swal.close();
                    } catch (error) {
                        Swal.fire('Error', 'No se pudo eliminar la página.', 'error');
                    }
                }
            });
        }


        // --- MÓDULO RIESGOS ---
        function getRiesgosHTML() {
            let notariaSelector = '';
            if (state.currentUser.role === 1) {
                notariaSelector = `
                    <select id="filtro_notaria_riesgos" class="border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none dyn-border-primary bg-white shadow-sm mt-4 sm:mt-0" onchange="cambiarFiltroGeneral(this.value)">
                        <option value="">Todas las Notarías</option>
                        ${LOCAL_DB.notarias.map(n => `<option value="${n.id}" ${state.filtroNotariaGeneral === n.id ? 'selected':''}>${n.nombre}</option>`).join('')}
                    </select>
                `;
            }

            return `
                <div class="space-y-6">
                    <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex flex-col sm:flex-row justify-between sm:items-center">
                        <div>
                            <h2 class="text-xl font-bold text-gray-800"><i class="fas fa-shield-alt text-red-600 mr-2"></i> Análisis de Riesgos de Lavado de Activos</h2>
                            <p class="text-sm text-gray-500 mt-1">Módulo para identificar operaciones inusuales o injustificadas según normativa UAFE.</p>
                        </div>
                        ${notariaSelector}
                    </div>
                    <div class="bg-white p-10 rounded-xl shadow-sm border border-gray-100 text-center">
                        <i class="fas fa-cogs text-5xl text-gray-300 mb-4"></i>
                        <h3 class="text-lg font-medium text-gray-700">Módulo en Construcción</h3>
                        <p class="text-sm text-gray-500 mt-2 max-w-md mx-auto">Aquí se integrarán las reglas de negocio para alertar sobre cuantías inusuales y generar los reportes a las entidades de control (UAFE).</p>
                    </div>
                </div>
            `;
        }

        // --- NAVEGACIÓN Y UTILIDADES ---
        function navigate(view) {
            state.currentView = view;
            renderCurrentView();
        }

        function updateSidebarActive() {
            if(!state.currentUser) return;
            const items = ['dashboard', 'actos', 'consultas', 'reportes', 'riesgos', 'usuarios'];
            items.forEach(item => {
                const el = document.getElementById(`nav-${item}`);
                if (el) {
                    if (item === state.currentView) {
                        el.classList.add('bg-black/20', 'font-medium', 'border-l-4', 'border-white');
                    } else {
                        el.classList.remove('bg-black/20', 'font-medium', 'border-l-4', 'border-white');
                    }
                }
            });
        }

        function handleLogin(e) {
            e.preventDefault();
            const user = document.getElementById('login-username').value;
            const pass = document.getElementById('login-password').value;
            
            const foundUser = LOCAL_DB.users.find(u => u.username === user && u.password === pass);
            
            if (foundUser) {
                state.currentUser = foundUser;
                state.currentView = 'dashboard';
                renderApp();
            } else {
                Swal.fire({ icon: 'error', title: 'Error', text: 'Credenciales incorrectas' });
            }
        }

        function handleLogout() {
            state.currentUser = null;
            state.currentView = 'login';
            renderApp();
        }

        function showModal(contentHTML) {
            const container = document.getElementById('modal-container');
            container.innerHTML = `
                <div class="fixed inset-0 bg-gray-900 bg-opacity-50 backdrop-blur-sm transition-opacity z-40"></div>
                <div class="fixed inset-0 z-50 overflow-y-auto">
                    <div class="flex min-h-full items-center justify-center p-4 text-center sm:p-0">
                        ${contentHTML}
                    </div>
                </div>
            `;
            container.classList.remove('hidden');
        }

        function closeModal() {
            const container = document.getElementById('modal-container');
            container.classList.add('hidden');
            container.innerHTML = '';
        }

        // --- INICIALIZACIÓN ---
        window.onload = async () => {
            Swal.fire({ title: 'Conectando con la Nube...', text: 'Descargando información segura', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } });
            await loadDataFromFirebase();
            Swal.close();
            renderApp();
        };

    </script>
</body>
</html>
