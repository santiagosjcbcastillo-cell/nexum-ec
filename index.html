<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUM - Sistema de Gestión Notarial</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para Iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SweetAlert2 para Alertas Estilizadas -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- SheetJS para Exportación a Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <!-- FIREBASE SDK (Compat Version para máxima compatibilidad con Vanilla JS) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: 'var(--color-primary)', 
                        secondary: '#3b82f6',
                        accent: '#fbbf24',
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --color-primary: #1e3a8a; 
        }
        body { font-family: 'Inter', system-ui, sans-serif; }
        .glass-effect {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
        }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .dyn-bg-primary { background-color: var(--color-primary) !important; }
        .dyn-text-primary { color: var(--color-primary) !important; }
        .dyn-border-primary { border-color: var(--color-primary) !important; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 overflow-hidden">

    <!-- CONTENEDOR PRINCIPAL -->
    <div id="app" class="h-screen w-full flex flex-col">
        <!-- Las vistas se inyectarán aquí mediante JavaScript -->
    </div>

    <!-- CONTENEDOR DE MODALES -->
    <div id="modal-container" class="relative z-50 hidden" aria-labelledby="modal-title" role="dialog" aria-modal="true">
        <!-- El contenido del modal se inyectará aquí -->
    </div>

    <!-- LÓGICA DE LA APLICACIÓN -->
    <script>
        // --- 1. CONFIGURACIÓN E INICIALIZACIÓN DE FIREBASE ---
        const firebaseConfig = {
            apiKey: "AIzaSyDVjVhJWhK3g1Yv0z9Yx1YLfpsX2bOGeCg",
            authDomain: "sistema-notarial-uafe.firebaseapp.com",
            projectId: "sistema-notarial-uafe",
            storageBucket: "sistema-notarial-uafe.firebasestorage.app",
            messagingSenderId: "412500807010",
            appId: "1:412500807010:web:4466cbccc2cf8ecc5df03b"
        };
        
        // Inicializar Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // --- CONFIGURACIÓN DINÁMICA DE LA INTERFAZ ---
        let sysConfig = JSON.parse(localStorage.getItem('notarySysConfig')) || {
            tituloApp: 'NEXUM',
            colorPrincipal: '#1e3a8a'
        };

        function aplicarConfiguracion() {
            document.documentElement.style.setProperty('--color-primary', sysConfig.colorPrincipal);
            document.title = sysConfig.tituloApp + ' - Gestión Notarial';
            
            const titleElements = document.querySelectorAll('.app-title-text');
            titleElements.forEach(el => el.innerText = sysConfig.tituloApp);
        }
        aplicarConfiguracion();

        // --- 2. BASE DE DATOS LOCAL (Sincronizada con Firebase) ---
        const LOCAL_DB = {
            notarias: [],
            users: [],
            actos: [],
            fuentesConsulta: []
        };

        const CATEGORIAS = {
            'Protocolo': [
                "Promesas de celebrar contratos", "Compraventa", "Compraventa de inmuebles (MIDUVI)", 
                "Transferencia de dominio con constitución de hipoteca", "Constitución de hipoteca", 
                "Constitución de hipoteca (BIESS/BEV/Municipalidades/Mutualistas/Cooperativas)", 
                "Constitución de hipoteca abierta", "Constitución de hipoteca (MIDUVI)", "Donación", 
                "Permuta", "Liquidación de la sociedad conyugal", "Liquidación de la sociedad de bienes", 
                "Dación en pago", "Cesión de derechos onerosos", "Comodato", 
                "Constitución de consorcios con cuantía determinada", "Traspaso de un crédito con cuantía", 
                "Cesión de participaciones"
            ],
            'Diligencia': [
                "Reconocimiento de firmas de vehículo", "Reconocimiento de firmas de contrato"
            ]
        };

        let state = {
            currentUser: null,
            currentView: 'login',
            filtroNotariaReporte: null,
            consultaTabActivaId: null
        };

        // --- CARGAR DATOS DESDE LA NUBE ---
        async function loadDataFromFirebase() {
            try {
                const usersSnap = await db.collection('users').get();
                LOCAL_DB.users = usersSnap.docs.map(doc => ({ id: doc.id, ...doc.data() }));

                const notariasSnap = await db.collection('notarias').get();
                LOCAL_DB.notarias = notariasSnap.docs.map(doc => ({ id: doc.id, ...doc.data() }));

                const actosSnap = await db.collection('actos').get();
                LOCAL_DB.actos = actosSnap.docs.map(doc => ({ id: doc.id, ...doc.data() }));

                const fuentesSnap = await db.collection('fuentesConsulta').get();
                LOCAL_DB.fuentesConsulta = fuentesSnap.docs.map(doc => ({ id: doc.id, ...doc.data() }));

                if (LOCAL_DB.users.length === 0) {
                    const adminData = { username: 'sjcastillob', password: '1234', role: 1, notariaId: null, nombre: 'Admin Global' };
                    const adminRef = await db.collection('users').add(adminData);
                    LOCAL_DB.users.push({ id: adminRef.id, ...adminData });
                }

                if (LOCAL_DB.fuentesConsulta.length === 0) {
                    const fuenteData = { nombre: 'Función Judicial - Procesos', url: 'https://procesosjudiciales.funcionjudicial.gob.ec/busqueda-filtros' };
                    const fuenteRef = await db.collection('fuentesConsulta').add(fuenteData);
                    LOCAL_DB.fuentesConsulta.push({ id: fuenteRef.id, ...fuenteData });
                }
            } catch (error) {
                console.error("Error al cargar datos de Firebase:", error);
                Swal.fire('Error', 'No se pudo establecer conexión con la base de datos en la nube.', 'error');
            }
        }

        // --- FUNCIONES PRINCIPALES DE RENDERIZADO ---
        function renderApp() {
            const app = document.getElementById('app');
            if (!state.currentUser) {
                app.innerHTML = getLoginHTML();
            } else {
                app.innerHTML = getLayoutHTML();
                renderCurrentView();
            }
            aplicarConfiguracion();
        }

        function renderCurrentView() {
            const content = document.getElementById('main-content');
            if (!content) return;

            switch(state.currentView) {
                case 'dashboard': content.innerHTML = getDashboardHTML(); break;
                case 'usuarios': content.innerHTML = getUsuariosHTML(); break;
                case 'actos': content.innerHTML = getActosHTML(); renderActosTable(); break;
                case 'reportes': content.innerHTML = getReportesHTML(); renderReportesTables(); break;
                case 'riesgos': content.innerHTML = getRiesgosHTML(); break;
                case 'consultas': content.innerHTML = getConsultasHTML(); renderConsultasViewer(); break;
                default: content.innerHTML = getDashboardHTML();
            }
            updateSidebarActive();
            aplicarConfiguracion();
        }

        // --- COMPONENTES HTML (Plantillas) ---
        function getLoginHTML() {
            return `
                <div class="flex items-center justify-center h-full w-full bg-gradient-to-br dyn-bg-primary to-blue-800" style="background-color: var(--color-primary);">
                    <div class="bg-white p-8 rounded-xl shadow-2xl w-full max-w-md fade-in glass-effect">
                        <div class="text-center mb-8">
                            <div class="inline-flex items-center justify-center w-16 h-16 rounded-full dyn-bg-primary text-white mb-4 shadow-lg">
                                <i class="fas fa-balance-scale text-3xl"></i>
                            </div>
                            <h1 class="text-3xl font-black text-gray-800 tracking-tight app-title-text">${sysConfig.tituloApp}</h1>
                            <p class="text-gray-500 text-sm mt-2">Sistema de Gestión Notarial</p>
                        </div>
                        <form onsubmit="handleLogin(event)" class="space-y-5">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Usuario</label>
                                <div class="relative">
                                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                        <i class="fas fa-user text-gray-400"></i>
                                    </div>
                                    <input type="text" id="login-username" required
                                        class="block w-full pl-10 pr-3 py-2 border border-gray-300 rounded-lg focus:outline-none dyn-border-primary sm:text-sm transition-colors"
                                        placeholder="Ej: sjcastillob">
                                </div>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
                                <div class="relative">
                                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                        <i class="fas fa-lock text-gray-400"></i>
                                    </div>
                                    <input type="password" id="login-password" required
                                        class="block w-full pl-10 pr-3 py-2 border border-gray-300 rounded-lg focus:outline-none dyn-border-primary sm:text-sm transition-colors"
                                        placeholder="••••••••">
                                </div>
                            </div>
                            <button type="submit" class="w-full flex justify-center py-2.5 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white dyn-bg-primary hover:opacity-90 focus:outline-none transition-colors">
                                Ingresar a ${sysConfig.tituloApp}
                            </button>
                        </form>
                    </div>
                </div>
            `;
        }

        function getLayoutHTML() {
            const roleName = state.currentUser.role === 1 ? 'SuperAdmin' : (state.currentUser.role === 2 ? 'Oficial de Cumplimiento' : 'Matrizador');
            const notariaName = state.currentUser.notariaId ? LOCAL_DB.notarias.find(n => n.id === state.currentUser.notariaId)?.nombre : 'Acceso Global';

            return `
                <header class="bg-white shadow-sm z-10 w-full flex-shrink-0 h-16 flex items-center justify-between px-6">
                    <div class="flex items-center gap-3">
                        <i class="fas fa-balance-scale dyn-text-primary text-2xl"></i>
                        <span class="font-black text-xl text-gray-800 tracking-tight app-title-text">${sysConfig.tituloApp}</span>
                    </div>
                    <div class="flex items-center gap-6">
                        ${state.currentUser.role === 1 ? `
                            <button onclick="openConfiguracionModal()" class="text-gray-500 hover:text-gray-800 font-medium text-sm transition-colors flex items-center gap-1 bg-gray-100 py-1.5 px-3 rounded-lg">
                                <i class="fas fa-cog"></i> Personalizar Interfaz
                            </button>
                        ` : ''}

                        ${(state.currentUser.role === 1 || state.currentUser.role === 2) ? 
                            `<button onclick="navigate('usuarios')" class="text-gray-600 dyn-text-primary font-medium text-sm transition-colors hover:opacity-80">
                                <i class="fas fa-users-cog mr-1"></i> Gestión de Usuarios
                            </button>` : ''
                        }
                        <div class="flex items-center gap-3 border-l pl-6 border-gray-200">
                            <div class="text-right hidden sm:block">
                                <p class="text-sm font-bold text-gray-800">${state.currentUser.nombre}</p>
                                <p class="text-xs text-gray-500">${roleName} | ${notariaName}</p>
                            </div>
                            <button onclick="handleLogout()" class="w-10 h-10 rounded-full bg-red-50 text-red-600 hover:bg-red-100 flex items-center justify-center transition-colors shadow-sm" title="Cerrar Sesión">
                                <i class="fas fa-sign-out-alt"></i>
                            </button>
                        </div>
                    </div>
                </header>

                <div class="flex flex-1 overflow-hidden">
                    <aside class="w-64 dyn-bg-primary text-white flex-shrink-0 overflow-y-auto hidden md:block shadow-inner">
                        <nav class="p-4 space-y-1">
                            <p class="px-3 text-xs font-semibold text-white/50 uppercase tracking-wider mb-2 mt-4">Operativa</p>
                            
                            <a href="#" onclick="navigate('dashboard')" id="nav-dashboard" class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-black/20 transition-colors">
                                <i class="fas fa-home w-5 text-center"></i> <span>Inicio</span>
                            </a>
                            
                            <a href="#" onclick="navigate('consultas')" id="nav-consultas" class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-black/20 transition-colors">
                                <i class="fas fa-search w-5 text-center"></i> <span>Consulta e-Satje</span>
                            </a>

                            <a href="#" onclick="navigate('actos')" id="nav-actos" class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-black/20 transition-colors">
                                <i class="fas fa-file-signature w-5 text-center"></i> <span>Creación de Actos</span>
                            </a>

                            ${(state.currentUser.role === 1 || state.currentUser.role === 2) ? `
                                <p class="px-3 text-xs font-semibold text-white/50 uppercase tracking-wider mb-2 mt-6">Administración</p>
                                <a href="#" onclick="navigate('reportes')" id="nav-reportes" class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-black/20 transition-colors">
                                    <i class="fas fa-chart-bar w-5 text-center"></i> <span>Generación Reportes</span>
                                </a>
                                <a href="#" onclick="navigate('riesgos')" id="nav-riesgos" class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-black/20 transition-colors">
                                    <i class="fas fa-shield-alt w-5 text-center"></i> <span>Análisis de Riesgos</span>
                                </a>
                            ` : ''}
                        </nav>
                    </aside>

                    <main id="main-content" class="flex-1 overflow-y-auto p-6 bg-gray-50 fade-in">
                    </main>
                </div>
            `;
        }

        // --- MÓDULO DE CONFIGURACIÓN DE INTERFAZ (ROL 1) ---
        function openConfiguracionModal() {
            const html = `
                <div class="bg-white rounded-xl shadow-2xl w-full max-w-md overflow-hidden transform transition-all fade-in">
                    <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center bg-gray-50">
                        <h3 class="text-lg font-bold text-gray-800"><i class="fas fa-cog text-gray-500 mr-2"></i> Configuración NEXUM</h3>
                        <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600"><i class="fas fa-times"></i></button>
                    </div>
                    <form onsubmit="guardarConfiguracion(event)" class="p-6 space-y-5">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Nombre del Sistema</label>
                            <input type="text" id="config_titulo" value="${sysConfig.tituloApp}" required class="block w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none dyn-border-primary sm:text-sm">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Color Principal (Institucional)</label>
                            <div class="flex items-center gap-3">
                                <input type="color" id="config_color" value="${sysConfig.colorPrincipal}" required class="h-10 w-14 rounded cursor-pointer border border-gray-300">
                                <input type="text" id="config_color_text" value="${sysConfig.colorPrincipal}" required class="block w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none dyn-border-primary sm:text-sm uppercase" oninput="document.getElementById('config_color').value = this.value">
                            </div>
                        </div>
                        <div class="flex justify-end gap-3 pt-4 border-t border-gray-100">
                            <button type="button" onclick="closeModal()" class="px-4 py-2 bg-white border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50 transition-colors">Cancelar</button>
                            <button type="submit" class="px-4 py-2 text-white rounded-lg hover:opacity-90 transition-colors font-medium dyn-bg-primary">Guardar Cambios</button>
                        </div>
                    </form>
                </div>
            `;
            showModal(html);
            document.getElementById('config_color').addEventListener('input', function(e) {
                document.getElementById('config_color_text').value = e.target.value;
            });
        }

        function guardarConfiguracion(e) {
            e.preventDefault();
            sysConfig = {
                tituloApp: document.getElementById('config_titulo').value,
                colorPrincipal: document.getElementById('config_color').value
            };
            localStorage.setItem('notarySysConfig', JSON.stringify(sysConfig));
            aplicarConfiguracion();
            closeModal();
            Swal.fire({ icon: 'success', title: 'Interfaz Actualizada', text: 'Los cambios se han aplicado exitosamente.', timer: 1500, showConfirmButton: false });
            setTimeout(() => { const navDashboard = state.currentView; renderApp(); navigate(navDashboard); }, 300);
        }

        function getDashboardHTML() {
            return `
                <div class="h-full flex flex-col items-center justify-center text-center space-y-6">
                    <div class="w-32 h-32 bg-white rounded-full shadow-lg flex items-center justify-center border-4 border-gray-100">
                        <i class="fas fa-balance-scale text-6xl dyn-text-primary"></i>
                    </div>
                    <div>
                        <h2 class="text-4xl font-black text-gray-800 tracking-tight"><span class="app-title-text">${sysConfig.tituloApp}</span></h2>
                        <p class="text-gray-500 mt-2 max-w-lg mx-auto font-medium">Plataforma integral para el control de actos, diligencias, cumplimiento y reportes operativos.</p>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-6 mt-8 w-full max-w-4xl">
                        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 flex flex-col items-center cursor-pointer hover:shadow-md transition-shadow" onclick="navigate('actos')">
                            <div class="bg-blue-50 p-3 rounded-full text-blue-600 mb-3"><i class="fas fa-file-alt text-xl"></i></div>
                            <h3 class="font-semibold text-gray-700">Actos Notariales</h3>
                            <p class="text-xs text-gray-400 mt-1">Gestionar protocolos y diligencias</p>
                        </div>
                        ${(state.currentUser.role === 1 || state.currentUser.role === 2) ? `
                        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 flex flex-col items-center cursor-pointer hover:shadow-md transition-shadow" onclick="navigate('reportes')">
                            <div class="bg-green-50 p-3 rounded-full text-green-600 mb-3"><i class="fas fa-chart-line text-xl"></i></div>
                            <h3 class="font-semibold text-gray-700">Reportes</h3>
                            <p class="text-xs text-gray-400 mt-1">Exportar a Excel (.xlsx)</p>
                        </div>
                        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 flex flex-col items-center cursor-pointer hover:shadow-md transition-shadow" onclick="navigate('usuarios')">
                            <div class="bg-purple-50 p-3 rounded-full text-purple-600 mb-3"><i class="fas fa-users-cog text-xl"></i></div>
                            <h3 class="font-semibold text-gray-700">Usuarios</h3>
                            <p class="text-xs text-gray-400 mt-1">Administración de personal</p>
                        </div>
                        ` : ''}
                    </div>
                </div>
            `;
        }

        // --- MÓDULO DE CONSULTAS e-SATJE (Due Diligence) ---
        function getConsultasHTML() {
            return `
                <div class="space-y-6">
                    <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                        <h2 class="text-2xl font-bold text-gray-800 mb-2"><i class="fas fa-search dyn-text-primary mr-2"></i> Búsqueda de Antecedentes (e-Satje)</h2>
                        <p class="text-sm text-gray-500 mb-6">Realice una debida diligencia rápida buscando causas judiciales relacionadas a un cliente.</p>
                        
                        <div class="flex flex-col md:flex-row gap-4 mb-6">
                            <div class="flex-1">
                                <label class="block text-sm font-medium text-gray-700 mb-1">Criterio de Búsqueda (Cédula, RUC, o Nombre)</label>
                                <input type="text" id="satje_input" placeholder="Ej: 1712345678" class="block w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none dyn-border-primary bg-gray-50">
                            </div>
                            <div class="flex items-end">
                                <button onclick="simularConsultaSatje()" class="w-full md:w-auto px-6 py-3 dyn-bg-primary text-white rounded-lg font-medium hover:opacity-90 transition-colors flex items-center justify-center gap-2">
                                    <i class="fas fa-search"></i> Buscar Causas
                                </button>
                            </div>
                        </div>
                    </div>

                    <div id="satje_resultados" class="hidden space-y-4">
                        <h3 class="font-bold text-gray-800 text-lg border-b pb-2">Resultados Encontrados</h3>
                        <div id="satje_lista_resultados" class="grid gap-4">
                        </div>
                    </div>
                </div>
            `;
        }

        function simularConsultaSatje() {
            const input = document.getElementById('satje_input').value.trim();
            if(!input) {
                Swal.fire('Atención', 'Ingrese una cédula o nombre para buscar.', 'warning');
                return;
            }

            Swal.fire({ 
                title: 'Conectando con e-Satje...', 
                text: 'Consultando Función Judicial', 
                allowOutsideClick: false, 
                didOpen: () => { Swal.showLoading() } 
            });

            setTimeout(() => {
                Swal.close();
                document.getElementById('satje_resultados').classList.remove('hidden');
                
                // Simulación inteligente
                const html = `
                    <div class="bg-white border border-l-4 border-l-amber-500 rounded-lg p-4 shadow-sm flex flex-col md:flex-row gap-4 justify-between">
                        <div>
                            <span class="bg-amber-100 text-amber-800 text-xs font-bold px-2 py-1 rounded mb-2 inline-block">DEMANDADO</span>
                            <h4 class="font-bold text-gray-800">${input.length < 13 ? 'CLIENTE CONSULTADO' : input}</h4>
                            <p class="text-sm text-gray-500 mt-1">Materia: CIVIL - COBRO DE PAGARÉ</p>
                            <p class="text-xs text-gray-400 mt-1"><i class="fas fa-gavel"></i> UNIDAD JUDICIAL CIVIL CON SEDE EN QUITO</p>
                        </div>
                        <div class="text-right">
                            <p class="text-sm font-bold text-gray-700">Proceso: 17230-2023-01452</p>
                            <p class="text-xs text-gray-500">Fecha: 15/05/2023</p>
                            <button class="mt-2 text-blue-600 hover:text-blue-800 text-sm font-medium"><i class="fas fa-external-link-alt"></i> Ver Detalle</button>
                        </div>
                    </div>
                    <div class="bg-white border border-l-4 border-l-blue-500 rounded-lg p-4 shadow-sm flex flex-col md:flex-row gap-4 justify-between">
                        <div>
                            <span class="bg-blue-100 text-blue-800 text-xs font-bold px-2 py-1 rounded mb-2 inline-block">ACTOR</span>
                            <h4 class="font-bold text-gray-800">${input.length < 13 ? 'CLIENTE CONSULTADO' : input}</h4>
                            <p class="text-sm text-gray-500 mt-1">Materia: FAMILIA - DIVORCIO</p>
                            <p class="text-xs text-gray-400 mt-1"><i class="fas fa-gavel"></i> UNIDAD JUDICIAL DE FAMILIA, MUJER, NIÑEZ</p>
                        </div>
                        <div class="text-right">
                            <p class="text-sm font-bold text-gray-700">Proceso: 17204-2021-09887</p>
                            <p class="text-xs text-gray-500">Fecha: 10/11/2021</p>

        function renderActosTable() {
            const tbody = document.getElementById('actos-table-body');
            const buscadorInput = document.getElementById('buscador-actos');
            if(!tbody) return;

            let actosMostrar = LOCAL_DB.actos;
            if (state.currentUser.role !== 1) {
                actosMostrar = actosMostrar.filter(a => a.notariaId === state.currentUser.notariaId);
            }

            const termino = buscadorInput ? buscadorInput.value.toLowerCase() : '';
            if (termino.trim() !== '') {
                actosMostrar = actosMostrar.filter(a => {
                    const seqStr = 'Acto-' + String(a.secuencial || 0).padStart(5, '0');
                    return seqStr.toLowerCase().includes(termino) || String(a.numero || '').toLowerCase().includes(termino);
                });
            }

            actosMostrar.sort((a, b) => new Date(b.fecha) - new Date(a.fecha));

            if (actosMostrar.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-gray-500">No hay actos registrados que coincidan con la búsqueda.</td></tr>`;
                return;
            }

            tbody.innerHTML = actosMostrar.map(acto => {
                const seqStr = 'Acto-' + String(acto.secuencial || 0).padStart(5, '0');
                const numTramiteHtml = acto.numero ? acto.numero : '<span class="text-gray-400 italic text-xs">Pendiente</span>';
                
                return `
                <tr class="hover:bg-blue-50/50 transition-colors group">
                    <td class="p-4 font-bold text-gray-800">${seqStr}</td>
                    <td class="p-4 text-sm font-medium text-gray-700">${numTramiteHtml}</td>
                    <td class="p-4 text-sm text-gray-600">${acto.categoria}</td>
                    <td class="p-4">
                        <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ${acto.tipo === 'Protocolo' ? 'bg-indigo-100 text-indigo-800' : 'bg-teal-100 text-teal-800'}">

        function updateCategorias(tipo) {
            const select = document.getElementById('acto_categoria');
            select.disabled = false;
            select.classList.remove('bg-gray-50');

            select.innerHTML = '<option value="">Seleccione una categoría...</option>' +

        async function guardarNuevoActo(e) {
            e.preventDefault();
            Swal.fire({ title: 'Guardando en la nube...', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } });

            const tipo = document.querySelector('input[name="tipo_tramite"]:checked').value;
            const numero = document.getElementById('acto_numero').value;
            const fecha = document.getElementById('acto_fecha').value;
            const categoria = document.getElementById('acto_categoria').value;
            const notariaId = state.currentUser.notariaId;

            const actosNotaria = LOCAL_DB.actos.filter(a => a.notariaId === notariaId);
            const maxSecuencial = actosNotaria.reduce((max, a) => Math.max(max, a.secuencial || 0), 0);
            const nuevoSecuencial = maxSecuencial + 1;

            const nuevoActoData = { 
                notariaId: notariaId, secuencial: nuevoSecuencial, tipo: tipo, numero: numero, 
                categoria: categoria, fecha: fecha, cuantia: '', forma_pago: '', intervinientes: [] 
            };

            try {
                const docRef = await db.collection('actos').add(nuevoActoData);
                nuevoActoData.id = docRef.id;
                LOCAL_DB.actos.push(nuevoActoData);
                closeModal();
                Swal.fire({ icon: 'success', title: 'Guardado', text: 'El acto ha sido registrado exitosamente.', timer: 1500, showConfirmButton: false });
                if (state.currentView === 'actos') renderActosTable();
            } catch (error) {
                console.error(error);
                Swal.fire('Error', 'No se pudo guardar en la base de datos.', 'error');
            }
        }

                nombre: card.querySelector('.int-nombre').value,
                nacionalidad: card.querySelector('.int-nacionalidad').value
            }));
        };

                showCancelButton: true,
                confirmButtonColor: '#d33',
                cancelButtonColor: '#3085d6',
                confirmButtonText: 'Sí, dar de baja',
                cancelButtonText: 'Cancelar'
            }).then((result) => {
                if (result.isConfirmed) {
                    window.syncIntervinientesForm(); // Guardamos el estado actual
                    window._tempEditIntervinientes.splice(idx, 1);
                    window.renderIntervinientesCards();
                }
            });
        };

        async function guardarEdicionActo(e, actoId) {
            e.preventDefault();
            window.syncIntervinientesForm(); // Asegurarnos de tener los datos de las tarjetas actualizados

            // Validar que los intervinientes no tengan campos en blanco
            let isValid = true;
            for(let int of window._tempEditIntervinientes) {
                if(!int.identificacion || !int.nombre || !int.nacionalidad) isValid = false;
            }
            if(!isValid) {
                Swal.fire('Campos Incompletos', 'Por favor, complete todos los campos obligatorios de los intervinientes.', 'warning');
                return;
            }

            Swal.fire({ title: 'Guardando en la Nube...', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } });

            const actoIndex = LOCAL_DB.actos.findIndex(a => a.id === actoId);
            if(actoIndex === -1) return;

            const updateData = {
                numero: document.getElementById('edit_numero').value,
                fecha: document.getElementById('edit_fecha').value,
                cuantia: document.getElementById('edit_cuantia').value,
                forma_pago: document.getElementById('edit_forma_pago').value,
                intervinientes: window._tempEditIntervinientes
            };

            try {
                await db.collection('actos').doc(actoId).update(updateData);
                LOCAL_DB.actos[actoIndex] = { ...LOCAL_DB.actos[actoIndex], ...updateData };
                
                closeModal();
                Swal.fire({ icon: 'success', title: 'Actualizado', text: 'El expediente fue actualizado correctamente.', timer: 2000, showConfirmButton: false });
                if (state.currentView === 'actos') renderActosTable();
            } catch (error) {
                Swal.fire('Error', 'No se pudo actualizar el registro en la nube.', 'error');
            }
        }

        function descargarFormulario(actoId) {
            const acto = LOCAL_DB.actos.find(a => a.id === actoId);
            if(!acto) return;
            const seqStr = 'Acto-' + String(acto.secuencial || 0).padStart(5, '0');

            let contenido = `====================================================\n`;
            contenido += `           FORMULARIO DE TRÁMITE NOTARIAL           \n`;
            contenido += `====================================================\n\n`;
            contenido += `DATOS DEL ACTO\n`;
            contenido += `----------------------------------------------------\n`;
            contenido += `ID Sistema:        ${seqStr}\n`;
            contenido += `Número de Trámite: ${acto.numero || 'Pendiente'}\n`;
            contenido += `Tipo de Trámite:   ${acto.tipo}\n`;
            contenido += `Categoría:         ${acto.categoria}\n`;
            contenido += `Fecha:             ${acto.fecha}\n`;
            contenido += `Cuantía:           $ ${acto.cuantia || '0.00'}\n`;
            contenido += `Forma de Pago:     ${acto.forma_pago || 'No especificada'}\n\n`;
            
            contenido += `INTERVINIENTES\n`;
            contenido += `----------------------------------------------------\n`;
            if (acto.intervinientes.length === 0) {
                contenido += `No hay intervinientes registrados.\n`;
            } else {
                acto.intervinientes.forEach((int, i) => {
                    contenido += `[${i+1}] ${int.tipo.toUpperCase()}\n`;
                    contenido += `    Nombre:         ${int.nombre}\n`;
                    contenido += `    Identificación: ${int.identificacion}\n`;
                    contenido += `    Nacionalidad:   ${int.nacionalidad}\n\n`;
                });
            }
            contenido += `====================================================\n`;
            contenido += `Generado por ${sysConfig.tituloApp} - Sistema Notarial\n`;

            const blob = new Blob([contenido], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Formulario_${seqStr}.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function eliminarActo(actoId) {
            Swal.fire({
                title: '¿Está seguro que desea eliminar este acto?',
                text: "Esta acción lo borrará permanentemente de la nube.",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#d33',
                cancelButtonColor: '#3085d6',
                confirmButtonText: 'Sí, eliminar',
                cancelButtonText: 'Cancelar'
            }).then(async (result) => {
                if (result.isConfirmed) {
                    Swal.fire({ title: 'Eliminando...', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } });
                    try {
                        await db.collection('actos').doc(actoId).delete();
                        LOCAL_DB.actos = LOCAL_DB.actos.filter(a => a.id !== actoId);
                        if (state.currentView === 'actos') renderActosTable();
                        Swal.fire('Eliminado!', 'El acto ha sido eliminado de la nube.', 'success');
                    } catch (error) {
                        Swal.fire('Error', 'No se pudo eliminar el registro.', 'error');
                    }
                }
            });
        }

        function getActosFiltradosReporte() {
            let actosFiltrados = LOCAL_DB.actos;
            if (state.currentUser.role === 2) {
                actosFiltrados = actosFiltrados.filter(a => a.notariaId === state.currentUser.notariaId);
            } else if (state.currentUser.role === 1 && state.filtroNotariaReporte) {
                actosFiltrados = actosFiltrados.filter(a => a.notariaId === state.filtroNotariaReporte);
            }

            if (currentReportTab === 'protocolos') {
                return actosFiltrados.filter(a => a.tipo === 'Protocolo');
            } else if (currentReportTab === 'vehiculos') {
                return actosFiltrados.filter(a => a.categoria === 'Reconocimiento de firmas de vehículo');
            } else if (currentReportTab === 'contratos') {
                return actosFiltrados.filter(a => a.categoria === 'Reconocimiento de firmas de contrato');
            }
            return actosFiltrados;
        }

        function exportarExcel(tipo) {
            const actosFiltrados = getActosFiltradosReporte();
            
            if (actosFiltrados.length === 0) {
                Swal.fire('Info', 'No hay datos para exportar.', 'info');
                return;
            }

            let wb = XLSX.utils.book_new();
            let ws;

            if (tipo === 'TODO') {
                const table = document.getElementById('tabla-reporte-datos');
                if (!table) return;
                ws = XLSX.utils.table_to_sheet(table, {sheet: currentReportTab});
                XLSX.utils.book_append_sheet(wb, ws, currentReportTab);
            } 
            else if (tipo === 'INT') {
                let data = [];
                actosFiltrados.forEach(a => {
                    const seqStr = `Acto-${String(a.secuencial || 0).padStart(5, '0')}`;
                    if (a.intervinientes.length === 0) {
                        data.push({ "ID Sistema": seqStr, "Nº Trámite": a.numero || "Pendiente", "Interviniente": "SIN REGISTROS" });
                    } else {
                        a.intervinientes.forEach(int => {
                            data.push({
                                "ID Sistema": seqStr,
                                "Nº Trámite": a.numero || "Pendiente",
                                "Calidad": int.tipo,
                                "Nombre": int.nombre,
                                "Identificación": int.identificacion,
                                "Nacionalidad": int.nacionalidad
                            });
                        });
                    }
                });
                ws = XLSX.utils.json_to_sheet(data);
                XLSX.utils.book_append_sheet(wb, ws, 'Intervinientes');
            }
            else if (tipo === 'TRA') {
                let data = actosFiltrados.map(a => {
                    const seqStr = `Acto-${String(a.secuencial || 0).padStart(5, '0')}`;
                    return {
                        "ID Sistema": seqStr,
                        "Nº Trámite": a.numero || "Pendiente",
                        "Tipo": a.tipo,
                        "Categoría": a.categoria,
                        "Fecha": a.fecha,
                        "Cuantía": a.cuantia,
                        "Forma Pago": a.forma_pago
                    };
                });
                ws = XLSX.utils.json_to_sheet(data);
                XLSX.utils.book_append_sheet(wb, ws, 'Trámites');
            }
            
            const dateStr = new Date().toISOString().slice(0,10);
            const fileName = `Reporte_${tipo}_${currentReportTab}_${dateStr}.xlsx`;
            XLSX.writeFile(wb, fileName);
            Swal.fire({ icon: 'success', title: '¡Descarga Iniciada!', text: `Se ha generado el archivo: ${fileName}`, timer: 2000, showConfirmButton: false });
        }

        let currentReportTab = 'protocolos';
        function switchReportTab(tab) {
            currentReportTab = tab;
            ['protocolos', 'vehiculos', 'contratos'].forEach(t => {
                const el = document.getElementById(`tab-${t}`);
                if(t === tab) {
                    el.classList.remove('border-transparent', 'text-gray-500');

        function renderReportesTables() {
            const container = document.getElementById('reporte-container');
            if(!container) return;

            const actosFiltrados = getActosFiltradosReporte();

            if (actosFiltrados.length === 0) {
                container.innerHTML = `<div class="p-10 text-center text-gray-500"><i class="fas fa-folder-open text-4xl mb-3 opacity-30"></i><p>No hay datos para generar este reporte.</p></div>`;
                return;
            }

            let html = `
                <div class="overflow-x-auto max-h-[60vh] custom-scrollbar">
                    <table id="tabla-reporte-datos" class="min-w-full text-sm border-collapse excel-table">
                        <thead class="bg-gray-100 sticky top-0 shadow-sm z-10">
                            <tr>
                                <th class="border border-gray-300 p-2 text-left font-semibold text-gray-700 bg-gray-200 w-24">ID Sistema</th>
                                <th class="border border-gray-300 p-2 text-left font-semibold text-gray-700 bg-gray-200 w-24">Nº Trámite</th>
                                <th class="border border-gray-300 p-2 text-left font-semibold text-gray-700 bg-gray-200 min-w-[200px]">Nombre del Acto</th>
                                <th class="border border-gray-300 p-2 text-left font-semibold text-gray-700 bg-gray-200 w-32">Fecha</th>
                                <th class="border border-gray-300 p-2 text-left font-semibold text-gray-700 bg-gray-200">Interviniente</th>
                                <th class="border border-gray-300 p-2 text-left font-semibold text-gray-700 bg-gray-200 w-24">Calidad</th>
                                <th class="border border-gray-300 p-2 text-left font-semibold text-gray-700 bg-gray-200 w-40">Identificación</th>
                                <th class="border border-gray-300 p-2 text-left font-semibold text-gray-700 bg-gray-200 w-32">Nacionalidad</th>
                            </tr>
                        </thead>
                        <tbody class="bg-white">
            `;

            actosFiltrados.forEach(acto => {
                const seqStr = 'Acto-' + String(acto.secuencial || 0).padStart(5, '0');
                const numTramiteStr = acto.numero || '-';

                let intervinientes = [...acto.intervinientes].sort((a, b) => {
                    if (a.tipo === 'Otorgante' && b.tipo === 'Beneficiario') return -1;
                    if (a.tipo === 'Beneficiario' && b.tipo === 'Otorgante') return 1;
                    return 0;
                });

                if (intervinientes.length === 0) {
                    html += `
                        <tr class="hover:bg-gray-50">
                            <td class="border border-gray-200 p-2 text-gray-800 align-top">${seqStr}</td>
                            <td class="border border-gray-200 p-2 text-gray-800 align-top">${numTramiteStr}</td>

                            <td class="border border-gray-200 p-2 text-gray-800 align-top">${acto.fecha}</td>
                            <td class="border border-gray-200 p-2 text-gray-400 italic text-center" colspan="4">Sin intervinientes registrados</td>
                        </tr>
                    `;
                } else {
                    const rowSpan = intervinientes.length;
                    html += `<tr class="hover:bg-gray-50">
                        <td class="border border-gray-200 p-2 text-gray-800 align-top font-semibold" rowspan="${rowSpan}">${seqStr}</td>
                        <td class="border border-gray-200 p-2 text-gray-800 align-top" rowspan="${rowSpan}">${numTramiteStr}</td>
                        <td class="border border-gray-200 p-2 text-gray-800 align-top" rowspan="${rowSpan}">${acto.categoria}</td>
                        <td class="border border-gray-200 p-2 text-gray-800 align-top" rowspan="${rowSpan}">${acto.fecha}</td>
                    `;

                    intervinientes.forEach((int, index) => {
                        if (index > 0) html += `<tr class="hover:bg-gray-50">`;
                        
                        html += `
                            <td class="border border-gray-200 p-2 text-gray-800">${int.nombre}</td>
                            <td class="border border-gray-200 p-2 text-gray-800 font-semibold text-xs uppercase">${int.tipo}</td>
                            <td class="border border-gray-200 p-2 text-gray-800 font-mono text-xs">${int.identificacion}</td>
                            <td class="border border-gray-200 p-2 text-gray-800">${int.nacionalidad}</td>
                        </tr>`;
                    });
                }
            });

            html += `</tbody></table></div>`;
            container.innerHTML = html;
        }

        async function guardarNuevoUsuario(e) {
            e.preventDefault();
            Swal.fire({ title: 'Creando cuenta en la nube...', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } });

            const nombre = document.getElementById('usr_nombre').value;
            const username = document.getElementById('usr_username').value;
            const password = document.getElementById('usr_password').value;
            const rol = parseInt(document.getElementById('usr_rol').value);
            let notariaId = document.getElementById('usr_notaria').value;

            if(LOCAL_DB.users.some(u => u.username === username)) {
                Swal.fire('Error', 'El nombre de usuario ya está en uso.', 'error');
                return;
            }

            try {
                if (rol === 1) {
                    notariaId = null;
                } else {
                    if (notariaId === 'NUEVA') {
                        const nuevaNotariaNombre = document.getElementById('usr_nueva_notaria_nombre').value;
                        const notariaRef = await db.collection('notarias').add({ nombre: nuevaNotariaNombre });
                        notariaId = notariaRef.id;
                        LOCAL_DB.notarias.push({ id: notariaId, nombre: nuevaNotariaNombre });
                    }
                }

                const nuevoUsuario = { nombre: nombre, username: username, password: password, role: rol, notariaId: notariaId };
                const docRef = await db.collection('users').add(nuevoUsuario);
                nuevoUsuario.id = docRef.id;
                
                LOCAL_DB.users.push(nuevoUsuario);

                closeModal();
                Swal.fire({ icon: 'success', title: '¡Usuario Creado!', text: 'El usuario ha sido registrado en la base de datos exitosamente.', confirmButtonColor: '#9333ea' });
                if (state.currentView === 'usuarios') renderCurrentView();

            } catch (error) {
                Swal.fire('Error', 'No se pudo crear el usuario en la nube.', 'error');
            }
        }

        function openEditUsuarioModal(userId) {
            const userToEdit = LOCAL_DB.users.find(u => u.id === userId);
            if (!userToEdit) return;

            const html = `
                <div class="bg-white rounded-xl shadow-2xl w-full max-w-lg overflow-hidden transform transition-all fade-in">
                    <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center bg-gray-50">
                        <h3 class="text-lg font-bold text-gray-800">Editar Usuario / Contraseña</h3>
                        <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600"><i class="fas fa-times"></i></button>
                    </div>
                    <form onsubmit="guardarEdicionUsuario(event, '${userId}')" class="p-6 space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Nombre Completo</label>
                            <input type="text" id="edit_usr_nombre" value="${userToEdit.nombre}" required class="block w-full border border-gray-300 rounded-lg px-3 py-2 sm:text-sm">
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Usuario (Login)</label>
                                <input type="text" id="edit_usr_username" value="${userToEdit.username}" required class="block w-full border border-gray-300 rounded-lg px-3 py-2 sm:text-sm">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Nueva Contraseña</label>
                                <input type="password" id="edit_usr_password" placeholder="Dejar en blanco para no cambiar" class="block w-full border border-gray-300 rounded-lg px-3 py-2 sm:text-sm placeholder:text-xs">
                            </div>
                        </div>
                        <div class="flex justify-end gap-3 pt-4 border-t border-gray-100">
                            <button type="button" onclick="closeModal()" class="px-4 py-2 bg-white border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50 transition-colors">Cancelar</button>
                            <button type="submit" class="px-4 py-2 bg-amber-500 rounded-lg text-white hover:bg-amber-600 transition-colors font-medium">Actualizar en la Nube</button>
                        </div>
                    </form>
                </div>
            `;
            showModal(html);
        }

        async function guardarEdicionUsuario(e, userId) {
            e.preventDefault();
            const userIndex = LOCAL_DB.users.findIndex(u => u.id === userId);
            if (userIndex === -1) return;

            const newNombre = document.getElementById('edit_usr_nombre').value;
            const newUsername = document.getElementById('edit_usr_username').value;
            const newPassword = document.getElementById('edit_usr_password').value;

            if(LOCAL_DB.users.some(u => u.username === newUsername && u.id !== userId)) {
                Swal.fire('Error', 'El nombre de usuario ya está en uso por otra persona.', 'error');
                return;
            }

            Swal.fire({ title: 'Actualizando...', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } });

            const updateData = { nombre: newNombre, username: newUsername };
            if (newPassword.trim() !== '') { updateData.password = newPassword; }

            try {
                await db.collection('users').doc(userId).update(updateData);
                LOCAL_DB.users[userIndex] = { ...LOCAL_DB.users[userIndex], ...updateData };
                
                closeModal();
                Swal.fire({ icon: 'success', title: 'Usuario Actualizado', text: 'Los datos se guardaron en la nube correctamente.', timer: 2000, showConfirmButton: false });
                if (state.currentView === 'usuarios') renderCurrentView();
            } catch (error) {
                Swal.fire('Error', 'No se pudo actualizar el registro en la nube.', 'error');
            }
        }

        function eliminarUsuario(userId) {
            Swal.fire({
                title: '¿Eliminar Usuario?',
                text: "El usuario perderá el acceso permanentemente.",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#d33',
                cancelButtonColor: '#3085d6',
                confirmButtonText: 'Sí, eliminar',
                cancelButtonText: 'Cancelar'
            }).then(async (result) => {
                if (result.isConfirmed) {
                    Swal.fire({ title: 'Eliminando...', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } });
                    try {
                        await db.collection('users').doc(userId).delete();
                        LOCAL_DB.users = LOCAL_DB.users.filter(u => u.id !== userId);
                        if (state.currentView === 'usuarios') renderCurrentView();
                        Swal.fire('Eliminado', 'El usuario fue eliminado de la base de datos.', 'success');
                    } catch (error) {
                        Swal.fire('Error', 'No se pudo eliminar el usuario de la nube.', 'error');
                    }
                }
            });
        }

        // --- MÓDULO RIESGOS ---
        function getRiesgosHTML() {
            return `
                <div class="space-y-6">
                    <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                        <h2 class="text-xl font-bold text-gray-800"><i class="fas fa-shield-alt text-red-600 mr-2"></i> Análisis de Riesgos de Lavado de Activos</h2>
                        <p class="text-sm text-gray-500 mt-1">Módulo para identificar operaciones inusuales o injustificadas según normativa UAFE.</p>
                    </div>
                    <div class="bg-white p-10 rounded-xl shadow-sm border border-gray-100 text-center">
                        <i class="fas fa-cogs text-5xl text-gray-300 mb-4"></i>
                        <h3 class="text-lg font-medium text-gray-700">Módulo en Construcción</h3>
                        <p class="text-sm text-gray-500 mt-2 max-w-md mx-auto">Aquí se integrarán las reglas de negocio para alertar sobre cuantías inusuales y generar los reportes a las entidades de control (UAFE).</p>
                    </div>
                </div>
            `;
        }

        // --- NAVEGACIÓN Y UTILIDADES ---
        function navigate(view) {
            state.currentView = view;
            renderCurrentView();
        }

        function updateSidebarActive() {
            if(!state.currentUser) return;
            const items = ['dashboard', 'actos', 'reportes', 'riesgos', 'usuarios', 'consultas'];
            items.forEach(item => {
                const el = document.getElementById(`nav-${item}`);
                if (el) {
                    if (item === state.currentView) {
                        el.classList.add('bg-black/20', 'font-medium', 'border-l-4', 'border-white');
                    } else {
                        el.classList.remove('bg-black/20', 'font-medium', 'border-l-4', 'border-white');
                    }
                }
            });
        }

        function handleLogin(e) {
            e.preventDefault();
            const user = document.getElementById('login-username').value;
            const pass = document.getElementById('login-password').value;
            
            const foundUser = LOCAL_DB.users.find(u => u.username === user && u.password === pass);
            
            if (foundUser) {
                state.currentUser = foundUser;
                state.currentView = 'dashboard';
                renderApp();
            } else {
                Swal.fire({ icon: 'error', title: 'Error', text: 'Credenciales incorrectas' });
            }
        }

        function handleLogout() {
            state.currentUser = null;
            state.currentView = 'login';
            renderApp();
        }

        function showModal(contentHTML) {
            const container = document.getElementById('modal-container');
            container.innerHTML = `
                <div class="fixed inset-0 bg-gray-900 bg-opacity-50 backdrop-blur-sm transition-opacity z-40"></div>
                <div class="fixed inset-0 z-50 overflow-y-auto">
                    <div class="flex min-h-full items-center justify-center p-4 text-center sm:p-0">
                        ${contentHTML}
                    </div>
                </div>
            `;
            container.classList.remove('hidden');
        }

        function closeModal() {
            const container = document.getElementById('modal-container');
            container.classList.add('hidden');
            container.innerHTML = '';
        }

        // --- INICIALIZACIÓN ---
        window.onload = async () => {
            // Mostrar pantalla de carga inicial al abrir la página web
            Swal.fire({ title: 'Conectando con la Nube...', text: 'Descargando información segura', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } });
            
            await loadDataFromFirebase();
            
            Swal.close();
            renderApp();
        };

    </script>
</body>
</html>
