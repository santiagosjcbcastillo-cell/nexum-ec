        const LOCAL_DB = { notarias: [], users: [], actos: [], fuentesConsulta: [] };

        let state = {
            currentUser: null,
            currentView: 'login',
            filtroNotariaGeneral: null,
            filtroNotariaReporte: null,
            consultaTabActivaId: null,
            sortOrder: 'desc' // asc o desc (aplica SOLO a ID Sistema)
        };

        // --- MANEJO DE SESIÓN LOCALSTORAGE ---
        const SESSION_KEY = 'notarySessionData';
        const SESSION_TIMEOUT_MS = 10 * 60 * 1000; // 10 minutos
        let sessionTimer = null;

        function updateSessionTime() {
            if (!state.currentUser) return;
            const sessionData = JSON.parse(localStorage.getItem(SESSION_KEY));
            if (sessionData) {
                sessionData.lastActive = new Date().getTime();
                localStorage.setItem(SESSION_KEY, JSON.stringify(sessionData));
            }
            clearTimeout(sessionTimer);
            sessionTimer = setTimeout(handleSessionTimeout, SESSION_TIMEOUT_MS);
        }

        function handleSessionTimeout() {
            if (state.currentUser) {
                handleLogout();
                Swal.fire({ icon: 'warning', title: 'Sesión Expirada', text: 'Tu sesión se ha cerrado automáticamente por inactividad (10 min).', confirmButtonColor: '#1e3a8a' });
            }
        }

        // Renovar la sesión con la actividad del usuario
        window.addEventListener('mousemove', updateSessionTime);
        window.addEventListener('keydown', updateSessionTime);
        window.addEventListener('click', updateSessionTime);

        async function loadDataFromFirebase() {
            try {
                if (!state.currentUser) {
                    throw new Error('No existe una sesión autenticada');
                }
        
                const user = state.currentUser;
        
                // Limpiar memoria antes de cargar
                LOCAL_DB.users = [];
                LOCAL_DB.notarias = [];
                LOCAL_DB.actos = [];
                LOCAL_DB.fuentesConsulta = [];
        
                // =====================================================
                // NOTARÍAS
                // =====================================================
        
                if (user.role === 1) {
                    // SuperAdmin: todas las notarías
                    const notariasSnap = await db
                        .collection('notarias')
                        .get();
        
                    LOCAL_DB.notarias = notariasSnap.docs.map(doc => ({
                        id: doc.id,
                        ...doc.data()
                    }));
        
                } else if (user.notariaId) {
                    // Oficial y Matrizador: únicamente su notaría
                    const notariaDoc = await db
                        .collection('notarias')
                        .doc(user.notariaId)
                        .get();
        
                    if (notariaDoc.exists) {
                        LOCAL_DB.notarias = [{
                            id: notariaDoc.id,
                            ...notariaDoc.data()
                        }];
                    }
                }
        
                // =====================================================
                // ACTOS
                // =====================================================
        
                let actosQuery = db.collection('actos');
        
                if (user.role === 2) {
                    // Oficial: todos los actos de su notaría
                    actosQuery = actosQuery.where(
                        'notariaId',
                        '==',
                        user.notariaId
                    );
        
                } else if (user.role === 3) {
                    // Matrizador: únicamente los actos creados por él
                    // dentro de su propia notaría
                    actosQuery = actosQuery
                        .where(
                            'notariaId',
                            '==',
                            user.notariaId
                        )
                        .where(
                            'creadoPorId',
                            '==',
                            user.id
                        );
                }
        
                const actosSnap = await actosQuery.get();
        
                LOCAL_DB.actos = actosSnap.docs.map(doc => ({
                    id: doc.id,
                    ...doc.data()
                }));
        
                // =====================================================
                // USUARIOS
                // =====================================================
        
                // Temporalmente solo conservamos al usuario autenticado.
                //
                // NO descargamos la colección completa "users" porque
                // todavía contiene contraseñas antiguas en texto plano.
                //
                // Posteriormente la Gestión de Usuarios usará un
                // endpoint seguro del backend.
                LOCAL_DB.users = [
                    {
                        ...state.currentUser
                    }
                ];
        
                // =====================================================
                // FUENTES DE CONSULTA
                // =====================================================
        
                const fuentesSnap = await db
                    .collection('fuentesConsulta')
                    .get();
        
                LOCAL_DB.fuentesConsulta = fuentesSnap.docs.map(doc => ({
                    id: doc.id,
                    ...doc.data()
                }));
        
            } catch (error) {
                console.error(
                    'Error cargando datos desde Firebase:',
                    error
                );
        
                throw error;
            }
        }

        function renderApp() {
            const app = document.getElementById('app');
            if (!state.currentUser) {
                app.innerHTML = getLoginHTML();
            } else {
                app.innerHTML = getLayoutHTML();
                renderCurrentView();
            }
        }

        function renderCurrentView() {
            const content = document.getElementById('main-content');
            if (!content) return;
            switch(state.currentView) {
                case 'dashboard': content.innerHTML = getDashboardHTML(); break;
                case 'usuarios': content.innerHTML = getUsuariosHTML(); break;
                case 'actos': content.innerHTML = getActosHTML(); renderActosTable(); break;
                case 'reportes': content.innerHTML = getReportesHTML(); renderReportesTables(); break;
                case 'riesgos': content.innerHTML = getRiesgosHTML(); break;
                case 'consultas': content.innerHTML = getConsultasHTML(); renderConsultasViewer(); break;
                default: content.innerHTML = getDashboardHTML();
            }
            updateSidebarActive();
        }

        function navigate(view) {
            state.currentView = view;
            if (state.currentUser) {
                const s = JSON.parse(localStorage.getItem(SESSION_KEY)) || {};
                s.lastView = view;
                localStorage.setItem(SESSION_KEY, JSON.stringify(s));
            }
            renderCurrentView();
        }

        function updateSidebarActive() {
            if(!state.currentUser) return;
            ['dashboard', 'actos', 'consultas', 'reportes', 'riesgos', 'usuarios'].forEach(item => {
                const el = document.getElementById(`nav-${item}`);
                if (el) {
                    if (item === state.currentView) el.classList.add('bg-black/20', 'font-medium', 'border-l-4', 'border-white');
                    else el.classList.remove('bg-black/20', 'font-medium', 'border-l-4', 'border-white');
                }
            });
        }

        async function handleLogin(e) {
            e.preventDefault();
        
            const username = document
                .getElementById('login-username')
                .value
                .trim();
        
            const password = document
                .getElementById('login-password')
                .value;
        
            Swal.fire({
                title: 'Verificando credenciales...',
                allowOutsideClick: false,
                didOpen: () => Swal.showLoading()
            });
        
            try {
                // 1. Validar usuario y contraseña en el backend de Vercel
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username,
                        password
                    })
                });
        
                if (!response.ok) {
                    throw new Error('Credenciales incorrectas');
                }
        
                const data = await response.json();
        
                if (!data.token) {
                    throw new Error('Token no recibido');
                }
        
                // 2. Crear sesión REAL de Firebase Authentication
                const credential = await auth.signInWithCustomToken(data.token);
        
                const uid = credential.user.uid;
        
                // 3. Obtener únicamente el perfil del usuario autenticado
                const userDoc = await db.collection('users').doc(uid).get();
        
                if (!userDoc.exists) {
                    await auth.signOut();
                    throw new Error('Perfil de usuario no encontrado');
                }
        
                const foundUser = {
                    id: uid,
                    ...userDoc.data()
                };
        
                if (foundUser.active === false) {
                    await auth.signOut();
                    throw new Error('Usuario deshabilitado');
                }
        
                // 4. Establecer usuario de NEXUM
                state.currentUser = foundUser;
                state.currentView = 'dashboard';
        
                // 5. Cargar información únicamente después de autenticarse
                await loadDataFromFirebase();
        
                // 6. Mantener información auxiliar de la interfaz
                localStorage.setItem(
                    SESSION_KEY,
                    JSON.stringify({
                        lastActive: new Date().getTime(),
                        lastView: 'dashboard'
                    })
                );
        
                updateSessionTime();
        
                Swal.close();
                renderApp();
        
            } catch (error) {
                console.error('Login Error:', error);
        
                try {
                    await auth.signOut();
                } catch (_) {}
        
                state.currentUser = null;
                Swal.fire({
                    icon: 'error',
                    title: 'Acceso Denegado',
                    text: 'Usuario o contraseña incorrectos.'
                });
            }
        }

        async function handleLogout() {
            try {
                await auth.signOut();
            } catch (error) {
                console.error('Logout Error:', error);
            }
        
            state.currentUser = null;
            state.currentView = 'login';
        
            localStorage.removeItem(SESSION_KEY);
            clearTimeout(sessionTimer);
        
            renderApp();
        }

        function cambiarFiltroGeneral(val) {
            state.filtroNotariaGeneral = val || null;

        function toggleSort() {
            state.sortOrder = state.sortOrder === 'asc' ? 'desc' : 'asc';
            const content = document.getElementById('main-content');
            if (content) { content.innerHTML = getActosHTML(); renderActosTable(); }
        }

        function renderActosTable() {
            const tbody = document.getElementById('actos-table-body');
            const buscadorInput = document.getElementById('buscador-actos');
            if(!tbody) return;

            let actosMostrar = [...LOCAL_DB.actos];
            
            // Privacidad de roles
            if (state.currentUser.role === 2) {
                actosMostrar = actosMostrar.filter(a => a.notariaId === state.currentUser.notariaId);
            } else if (state.currentUser.role === 1 && state.filtroNotariaGeneral) {
                actosMostrar = actosMostrar.filter(a => a.notariaId === state.filtroNotariaGeneral);
            } else if (state.currentUser.role === 3) {
                // Matrizador ve solo lo que él ha creado en su notaría
                actosMostrar = actosMostrar.filter(a => a.notariaId === state.currentUser.notariaId && a.creadoPorId === state.currentUser.id);
            }

            // Búsqueda
            const termino = buscadorInput ? buscadorInput.value.toLowerCase() : '';
            if (termino.trim() !== '') {
                actosMostrar = actosMostrar.filter(a => {
                    const seqStr = 'Acto-' + String(a.secuencial || 0).padStart(5, '0');
                    return seqStr.toLowerCase().includes(termino) || String(a.numero || '').toLowerCase().includes(termino);
                });
            }

            // Ordenamiento EXCLUSIVO por secuencial (ID Sistema)
            actosMostrar.sort((a, b) => {
                let valA = parseInt(a.secuencial) || 0;
                let valB = parseInt(b.secuencial) || 0;
                if (valA < valB) return state.sortOrder === 'asc' ? -1 : 1;
                if (valA > valB) return state.sortOrder === 'asc' ? 1 : -1;
                return 0;
            });

            if (actosMostrar.length === 0) {
                const cols = (state.currentUser.role === 1 || state.currentUser.role === 2) ? 7 : 6;
                tbody.innerHTML = `<tr><td colspan="${cols}" class="p-8 text-center text-gray-500">No hay actos registrados.</td></tr>`;
                return;
            }

            tbody.innerHTML = actosMostrar.map(acto => {
                const seqStr = 'Acto-' + String(acto.secuencial || 0).padStart(5, '0');
                const numTramiteHtml = acto.numero ? acto.numero : '<span class="text-gray-400 italic text-xs">Pendiente</span>';
                const colCreadoPor = (state.currentUser.role === 1 || state.currentUser.role === 2) ? 
                    `<td class="p-4 text-sm font-medium text-gray-600"><i class="fas fa-user-edit text-gray-400 mr-1"></i> ${acto.creadoPorNombre || 'Sistema'}</td>` : '';

                return `
                <tr class="hover:bg-blue-50/50 transition-colors group">
                    <td class="p-4 font-bold text-gray-800">${seqStr}</td>
                    <td class="p-4 text-sm font-medium text-gray-700">${numTramiteHtml}</td>
                    <td class="p-4 text-sm text-gray-600">${acto.categoria}</td>
                    <td class="p-4"><span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ${acto.tipo === 'Protocolo' ? 'bg-indigo-100 text-indigo-800' : 'bg-teal-100 text-teal-800'}">${acto.tipo}</span></td>
                    <td class="p-4 text-sm text-gray-500 whitespace-nowrap"><i class="far fa-calendar-alt mr-1"></i> ${acto.fecha}</td>
                    ${colCreadoPor}
                    <td class="p-4 whitespace-nowrap">
                        <div class="flex items-center justify-end gap-2">
                            <button onclick="openEditActoModal('${acto.id}')" class="w-8 h-8 rounded-full bg-amber-100 text-amber-600 hover:bg-amber-500 hover:text-white flex items-center justify-center transition-colors" title="Editar Detalles e Intervinientes"><i class="fas fa-edit"></i></button>
                            <button onclick="descargarFormulario('${acto.id}')" class="w-8 h-8 rounded-full bg-green-100 text-green-600 hover:bg-green-600 hover:text-white flex items-center justify-center transition-colors" title="Descargar Formulario"><i class="fas fa-file-download"></i></button>
                            <button onclick="eliminarActo('${acto.id}')" class="w-8 h-8 rounded-full bg-red-100 text-red-600 hover:bg-red-600 hover:text-white flex items-center justify-center transition-colors" title="Eliminar Acto"><i class="fas fa-trash-alt"></i></button>
                        </div>
                    </td>
                </tr>`;
            }).join('');
        }

        async function guardarNuevoActo(e) {
            e.preventDefault();
            let notariaId = state.currentUser.notariaId;
            if (state.currentUser.role === 1) {
                if (state.filtroNotariaGeneral) notariaId = state.filtroNotariaGeneral;
                else { Swal.fire('Atención', 'Como Administrador Global, primero seleccione una Notaría en el filtro superior.', 'warning'); return; }
            }

            Swal.fire({ title: 'Asegurando ID...', text: 'Verificando concurrencia en la nube', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } });

            try {
                // Consulta en tiempo real a Firebase antes de calcular el ID (Solución Condición de Carrera)
                const actosSnap = await db.collection('actos').where('notariaId', '==', notariaId).get();
                let maxSecuencial = 0;
                actosSnap.forEach(doc => { const seq = doc.data().secuencial || 0; if (seq > maxSecuencial) maxSecuencial = seq; });
                const nuevoSecuencial = maxSecuencial + 1;

                const nuevoActoData = { 
                    notariaId: notariaId, secuencial: nuevoSecuencial, 
                    tipo: document.querySelector('input[name="tipo_tramite"]:checked').value, 
                    numero: document.getElementById('acto_numero').value, 
                    categoria: document.getElementById('acto_categoria').value, 
                    fecha: document.getElementById('acto_fecha').value, 
                    cuantia: '', forma_pago: '', moneda: 'USD - Dólares Estadounidenses',
                    clase_bien: '', tipo_bien: '', intervinientes: [],
                    creadoPorId: state.currentUser.id, creadoPorNombre: state.currentUser.nombre 
                };

                const docRef = await db.collection('actos').add(nuevoActoData);
                nuevoActoData.id = docRef.id;
                LOCAL_DB.actos.push(nuevoActoData);
                
                closeModal();
                Swal.fire({ icon: 'success', title: 'Guardado', text: `Asignado el ID Acto-${String(nuevoSecuencial).padStart(5, '0')}`, timer: 2000, showConfirmButton: false });
                if (state.currentView === 'actos') renderActosTable();
                
            } catch (error) {
                Swal.fire('Error', 'No se pudo guardar en la base de datos.', 'error');
            }
        }

        window.actualizarTiposDeBien = function() {
            const claseSelect = document.getElementById('edit_clase_bien');
            const tipoSelect = document.getElementById('edit_tipo_bien');
            if(!claseSelect || !tipoSelect) return;
            const clase = claseSelect.value;
            const selected = tipoSelect.getAttribute('data-selected');
            
            if(!clase) {
                tipoSelect.innerHTML = '<option value="">No aplica...</option>';
                tipoSelect.disabled = true; return;
            }
            tipoSelect.disabled = false;
            let options = '<option value="">Seleccione...</option>';
            DIC_TIPOS_BIEN.forEach(b => {
                if(b.clase === clase || b.clase === 'Ambos') {
                    options += `<option value="${b.id}" ${selected===b.id?'selected':''}>${b.id} - ${b.desc}</option>`;
                }
            });
            tipoSelect.innerHTML = options;
        };

        window.renderIntervinientesCards = function() {

            let html = '';
            window._tempEditIntervinientes.forEach((int, idx) => {
                const isNatural = int.naturaleza === 'Natural';
                const isBeneficiario = int.rol === '02';
                const hasRep = (!isNatural) || (isNatural && int.comparecencia === 'Representado');

                // Dictionaries HTML
                const optNac = (sel) => DIC_NACIONALIDADES.map(n => `<option value="${n}" ${sel===n?'selected':''}>${n}</option>`).join('');
                const optId = (sel) => DIC_TIPOS_ID.map(t => `<option value="${t.id}" ${sel===t.id?'selected':''}>${t.id} - ${t.desc}</option>`).join('');
                const optCiv = (sel) => DIC_ESTADOS_CIVILES.map(e => `<option value="${e}" ${sel===e?'selected':''}>${e}</option>`).join('');
                const optProv = (sel) => Object.keys(DIC_PROVINCIAS).map(p => `<option value="${p}" ${sel===p?'selected':''}>${p}</option>`).join('');
                
                const cantonesBase = DIC_PROVINCIAS[int.provincia || 'Pichincha'] || [];

            if (isRep) {
                window._tempEditIntervinientes[idx].repProvincia = prov;
                window._tempEditIntervinientes[idx].repCanton = cantones[0] || '';
            } else {
                window._tempEditIntervinientes[idx].provincia = prov;
                window._tempEditIntervinientes[idx].canton = cantones[0] || '';
            }
            window.renderIntervinientesCards();
        }

            if(!container) return;
            const cards = container.querySelectorAll('.interviniente-card');
            
            window._tempEditIntervinientes = Array.from(cards).map(card => {
                const isNat = card.querySelector('.f-nat:checked').value === 'Natural';
                return {
                    rol: card.querySelector('.f-rol').value,
                    naturaleza: isNat ? 'Natural' : 'Juridica',

                    window.syncIntervinientesForm();
                    window._tempEditIntervinientes.splice(idx, 1);
                    window.renderIntervinientesCards();
                }
            });
        };

        async function guardarEdicionActo(e, actoId) {
            e.preventDefault();
            window.syncIntervinientesForm(); 

            // Validacion básica
            let isValid = true;
            for(let int of window._tempEditIntervinientes) {
                if(!int.numId) isValid = false;
                if(int.naturaleza === 'Natural' && !int.nombre) isValid = false;
                if(int.naturaleza === 'Juridica' && !int.razonSocial) isValid = false;
            }
            if(!isValid) { Swal.fire('Incompleto', 'Se requiere al menos Número de ID y Nombre/Razón Social en todos los comparecientes.', 'warning'); return; }

            Swal.fire({ title: 'Guardando...', didOpen: () => { Swal.showLoading() } });

            const updateData = {
                numero: document.getElementById('edit_numero').value,
                fecha: document.getElementById('edit_fecha').value,
                moneda: document.getElementById('edit_moneda').value,
                cuantia: document.getElementById('edit_cuantia').value,
                forma_pago: document.getElementById('edit_forma_pago').value,
                clase_bien: document.getElementById('edit_clase_bien').value,
                tipo_bien: document.getElementById('edit_tipo_bien').value,
                intervinientes: window._tempEditIntervinientes
            };

            try {
                await db.collection('actos').doc(actoId).update(updateData);
                const aIdx = LOCAL_DB.actos.findIndex(a => a.id === actoId);
                if(aIdx !== -1) LOCAL_DB.actos[aIdx] = { ...LOCAL_DB.actos[aIdx], ...updateData };
                
                closeModal();
                Swal.fire({ icon: 'success', title: 'Acto Actualizado', timer: 1500, showConfirmButton: false });
                if (state.currentView === 'actos') renderActosTable();
            } catch (error) { Swal.fire('Error', 'No se pudo guardar la edición.', 'error'); }
        }

        function descargarFormulario(actoId) {
            const acto = LOCAL_DB.actos.find(a => a.id === actoId);
            if(!acto) return;
            const seqStr = 'Acto-' + String(acto.secuencial || 0).padStart(5, '0');

            let c = `======= FORMULARIO DE TRÁMITE =======\nID: ${seqStr}\nFecha: ${acto.fecha}\nCategoría: ${acto.categoria}\n\n--- INTERVINIENTES ---\n`;
            acto.intervinientes.forEach((i, idx) => {
                c += `[${idx+1}] ROL: ${i.rol === '01' ? 'Otorgante' : 'Beneficiario'}\n`;
                if(i.naturaleza === 'Natural') c += `Nombre: ${i.nombre}\nID: ${i.numId}\n`;
                else c += `Razón Social: ${i.razonSocial}\nRUC: ${i.numId}\nRepresentado por: ${i.repNombre} (${i.repNumId})\n`;
                c += `\n`;
            });
            const url = URL.createObjectURL(new Blob([c], { type: 'text/plain' }));
            const a = document.createElement('a'); a.href = url; a.download = `Formulario_${seqStr}.txt`; a.click();
        }

        function eliminarActo(actoId) {
            Swal.fire({ title: '¿Eliminar Acto?', icon: 'warning', showCancelButton: true, confirmButtonColor: '#d33' })
            .then(async (res) => {
                if (res.isConfirmed) {
                    Swal.fire({ title: 'Eliminando...', didOpen: () => { Swal.showLoading() } });
                    try {
                        await db.collection('actos').doc(actoId).delete();
                        LOCAL_DB.actos = LOCAL_DB.actos.filter(a => a.id !== actoId);
                        renderActosTable();
                        Swal.fire('Eliminado', '', 'success');
                    } catch (e) { Swal.fire('Error', '', 'error'); }
                }
            });
        }

            let ns = '';
            if (state.currentUser.role === 1) {
                ns = `<div class="mb-6 bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex items-center gap-4"><label>Seleccionar Notaría:</label>
                      <select class="border border-gray-300 rounded px-3 py-1 text-sm" onchange="cambiarFiltroReportes(this.value)">
                      <option value="">Todas (Consolidado)</option>${LOCAL_DB.notarias.map(n => `<option value="${n.id}">${n.nombre}</option>`).join('')}</select></div>`;

                ${ns}
                <div id="reporte-container" class="bg-white rounded-xl shadow-sm border border-gray-100 p-8 text-center text-gray-500">Vista preliminar. Presione "Bajar Excel" para obtener el formato.</div>

        function exportarExcel() {
            let datos = LOCAL_DB.actos;
            if (state.currentUser.role === 2) datos = datos.filter(a => a.notariaId === state.currentUser.notariaId);
            else if (state.currentUser.role === 1 && state.filtroNotariaReporte) datos = datos.filter(a => a.notariaId === state.filtroNotariaReporte);
            
            if(datos.length === 0) { Swal.fire('Vacio','No hay datos','info'); return; }
            let filas = datos.map(a => ({ "ID": a.secuencial, "Fecha": a.fecha, "Categoría": a.categoria, "Nº Intervinientes": a.intervinientes.length }));
            let wb = XLSX.utils.book_new(), ws = XLSX.utils.json_to_sheet(filas);
            XLSX.utils.book_append_sheet(wb, ws, "Datos"); XLSX.writeFile(wb, `Reporte.xlsx`);
        }

                    <tbody class="divide-y">
                        ${usrFiltrados.map(u => `<tr><td class="p-3 font-medium">${u.nombre}</td><td class="p-3 text-gray-500">${u.username}</td><td class="p-3">${u.role===2?'Oficial':'Matrizador'}</td><td class="p-3">${LOCAL_DB.notarias.find(n=>n.id===u.notariaId)?.nombre||'-'}</td><td class="p-3"><button onclick="eliminarUsuario('${u.id}')" class="text-red-500 p-2"><i class="fas fa-trash"></i></button></td></tr>`).join('')}

        async function borrarNotaria(id) {
            if(LOCAL_DB.users.some(u=>u.notariaId===id)) { Swal.fire('Bloqueado', 'Existen usuarios asignados a esta notaría.', 'warning'); return; }
            Swal.fire({title:'¿Borrar Notaría?', showCancelButton:true}).then(async r => {
                if(r.isConfirmed){ await db.collection('notarias').doc(id).delete(); LOCAL_DB.notarias=LOCAL_DB.notarias.filter(n=>n.id!==id); renderCurrentView(); }
            });
        }
        function openNotariaModal() {
            showModal(`<div class="bg-white p-6 rounded-lg w-96"><h3 class="font-bold mb-4">Nueva Notaría</h3><input type="text" id="nn_nom" class="w-full border p-2 rounded mb-4" placeholder="Nombre (Ej: Notaría 11 Quito)"><div class="flex justify-end gap-2"><button onclick="closeModal()" class="px-3 py-1 bg-gray-200 rounded">Cancelar</button><button onclick="saveNotaria()" class="px-3 py-1 bg-blue-600 text-white rounded">Guardar</button></div></div>`);
        }
        async function saveNotaria() {
            const nom = document.getElementById('nn_nom').value;
            if(!nom) return;
            Swal.fire({title:'Guardando...', didOpen:()=>Swal.showLoading()});
            const ref = await db.collection('notarias').add({nombre:nom});
            LOCAL_DB.notarias.push({id:ref.id, nombre:nom});
            closeModal(); Swal.close(); renderCurrentView();
        }

        function openNuevoUsuarioModal() {
            const roleOpts = state.currentUser.role === 1 ? `<option value="1">SuperAdmin</option><option value="2" selected>Oficial</option><option value="3">Matrizador</option>` : `<option value="3">Matrizador</option>`;
            
            // Obliga a crear la notaria primero
            let notOpts = '';
            if(state.currentUser.role === 1) {
                notOpts = `<option value="">-- Seleccione Notaría --</option>` + LOCAL_DB.notarias.map(n=>`<option value="${n.id}">${n.nombre}</option>`).join('');
            } else {
                notOpts = `<option value="${state.currentUser.notariaId}">${LOCAL_DB.notarias.find(n=>n.id===state.currentUser.notariaId).nombre}</option>`;
            }
            
            showModal(`
                <div class="bg-white p-6 rounded-xl w-full max-w-md">
                    <h3 class="font-bold mb-4">Nuevo Usuario</h3>
                    <form onsubmit="saveUser(event)" class="space-y-3">
                        <input type="text" id="nu_nom" required placeholder="Nombre Completo" class="w-full border p-2 rounded text-sm">
                        <input type="text" id="nu_usr" required placeholder="Usuario (login)" class="w-full border p-2 rounded text-sm">
                        <input type="password" id="nu_pwd" required placeholder="Clave" class="w-full border p-2 rounded text-sm">
                        <select id="nu_rol" class="w-full border p-2 rounded text-sm" onchange="document.getElementById('nu_not').disabled=(this.value==='1')">${roleOpts}</select>
                        <select id="nu_not" required class="w-full border p-2 rounded text-sm">${notOpts}</select>
                        <div class="flex justify-end gap-2 pt-2"><button type="button" onclick="closeModal()" class="px-3 py-1.5 bg-gray-200 rounded text-sm">Cancelar</button><button type="submit" class="px-3 py-1.5 bg-purple-600 text-white rounded text-sm">Guardar</button></div>
                    </form>
                </div>
            `);
        }
        async function saveUser(e) {
            e.preventDefault();
            const usr = document.getElementById('nu_usr').value;
            if(LOCAL_DB.users.some(u=>u.username===usr)) { Swal.fire('Error','Usuario en uso','error'); return; }
            Swal.fire({title:'Guardando...', didOpen:()=>Swal.showLoading()});
            
            const isSuper = document.getElementById('nu_rol').value === '1';
            const data = { nombre:document.getElementById('nu_nom').value, username:usr, password:document.getElementById('nu_pwd').value, role:parseInt(document.getElementById('nu_rol').value), notariaId: isSuper ? null : document.getElementById('nu_not').value };
            
            if(!isSuper && !data.notariaId) { Swal.fire('Error', 'Seleccione una notaría válida.', 'warning'); return; }

            const ref = await db.collection('users').add(data);
            LOCAL_DB.users.push({id:ref.id, ...data});
            closeModal(); Swal.close(); renderCurrentView();
        }
        function eliminarUsuario(id) {
            Swal.fire({title:'¿Borrar?', showCancelButton:true}).then(async r=>{ if(r.isConfirmed){ await db.collection('users').doc(id).delete(); LOCAL_DB.users=LOCAL_DB.users.filter(u=>u.id!==id); renderCurrentView(); } });
        }

                            <div class="border border-gray-200 rounded-lg p-4 shadow-sm hover:shadow-md transition-shadow">
                                <div class="flex justify-between items-start mb-2"><span class="font-mono text-sm font-bold text-blue-800 bg-blue-50 px-2 py-1 rounded">17230-2018-00412</span><span class="text-xs font-semibold text-gray-500"><i class="far fa-calendar-alt"></i> 02/09/2018</span></div>

                                <div class="grid grid-cols-2 text-sm mt-2"><p><span class="text-gray-500">Actor/Ofendido:</span> ${input.toUpperCase()}</p><p><span class="text-gray-500">Demandado/Procesado:</span> PERSONA PRUEBA</p></div>

        function showModal(contentHTML) {
            const container = document.getElementById('modal-container');
            container.innerHTML = `
                <div class="fixed inset-0 bg-gray-900 bg-opacity-50 backdrop-blur-sm transition-opacity z-40"></div>
                <div class="fixed inset-0 z-50 overflow-y-auto">
                    <div class="flex min-h-full items-center justify-center p-4 text-center sm:p-0">
                        ${contentHTML}
                    </div>
                </div>
            `;
            container.classList.remove('hidden');
        }

        function closeModal() {
            const container = document.getElementById('modal-container');
            container.classList.add('hidden');
            container.innerHTML = '';
        }

        window.onload = () => {

            Swal.fire({
                title: 'Conectando con la Nube...',
                allowOutsideClick: false,
                didOpen: () => Swal.showLoading()
            });
        
            const unsubscribe = auth.onAuthStateChanged(async (firebaseUser) => {
        
                // Solo necesitamos este listener para restaurar
                // la sesión cuando carga la página.
                unsubscribe();
        
                try {
        
                    // -----------------------------------------
                    // NO existe sesión Firebase
                    // -----------------------------------------
                    if (!firebaseUser) {
        
                        state.currentUser = null;
                        state.currentView = 'login';
        
                        localStorage.removeItem(SESSION_KEY);
        
                        Swal.close();
                        renderApp();
        
                        return;
                    }
        
                    // -----------------------------------------
                    // Verificar tiempo de inactividad
                    // -----------------------------------------
                    const savedSessionStr =
                        localStorage.getItem(SESSION_KEY);
        
                    if (!savedSessionStr) {
        
                        await auth.signOut();
        
                        state.currentUser = null;
                        state.currentView = 'login';
        
                        Swal.close();
                        renderApp();
        
                        return;
                    }
        
                    const savedSession =
                        JSON.parse(savedSessionStr);
        
                    const now = new Date().getTime();
        
                    if (
                        !savedSession.lastActive ||
                        now - savedSession.lastActive >= SESSION_TIMEOUT_MS
                    ) {
        
                        await auth.signOut();
        
                        localStorage.removeItem(SESSION_KEY);
        
                        state.currentUser = null;
                        state.currentView = 'login';
        
                        Swal.close();
                        renderApp();
        
                        return;
                    }
        
                    // -----------------------------------------
                    // Obtener perfil REAL desde Firestore
                    // -----------------------------------------
                    const userDoc = await db
                        .collection('users')
                        .doc(firebaseUser.uid)
                        .get();
        
                    if (!userDoc.exists) {
        
                        await auth.signOut();
        
                        localStorage.removeItem(SESSION_KEY);
        
                        state.currentUser = null;
                        state.currentView = 'login';
        
                        Swal.close();
                        renderApp();
        
                        return;
                    }
        
                    const foundUser = {
                        id: firebaseUser.uid,
                        ...userDoc.data()
                    };
        
                    // Usuario deshabilitado
                    if (foundUser.active === false) {
        
                        await auth.signOut();
        
                        localStorage.removeItem(SESSION_KEY);
        
                        state.currentUser = null;
                        state.currentView = 'login';
        
                        Swal.close();
                        renderApp();
        
                        return;
                    }
        
                    // -----------------------------------------
                    // Restaurar NEXUM
                    // -----------------------------------------
                    state.currentUser = foundUser;
        
                    state.currentView =
                        savedSession.lastView || 'dashboard';
        
                    localStorage.setItem(
                        SESSION_KEY,
                        JSON.stringify({
                            lastActive: now,
                            lastView: state.currentView
                        })
                    );
        
                    updateSessionTime();
        
                    // Los datos se cargan SOLO después
                    // de comprobar Firebase Authentication.
                    await loadDataFromFirebase();
        
                    Swal.close();
                    renderApp();
        
                } catch (error) {
        
                    console.error(
                        'Error restaurando sesión:',
                        error
                    );
        
                    try {
                        await auth.signOut();
                    } catch (_) {}
        
                    localStorage.removeItem(SESSION_KEY);
        
                    state.currentUser = null;
                    state.currentView = 'login';
        
                    Swal.close();
                    renderApp();
                }
            });
        };
    </script>
